<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOOLS BC1+BC2+SBD</title>
<style>
/*FONTS*/
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunken:#F5F7FA; --hover:#F0F4FA;
  --ink:#14213D; --ink2:#3D4A60; --muted:#6B7689; --line:#D9DFE7; --line2:#E8ECF1;
  --brand:#1D4E89; --brand-ink:#153B69; --brand-tint:#E7EEF8;
  --seal:#B42318; --seal-tint:#FCEBE9;
  --amber:#A15C07; --amber-tint:#FEF3E2; --amber-line:#F2C27A;
  --ok:#067647; --ok-tint:#E6F5EC;
  --loai:#FFF4B8; --loai-line:#D9A800;
  --side:#112A4A; --side2:#183760; --side-ink:#C9D6E8; --side-mute:#8197B5;
  --r:8px; --r-lg:12px;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 1px 1px rgba(20,33,61,.04);
  --font:'Be Vietnam Pro',"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ico{width:16px;height:16px;flex:none;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}

/* ===== KHUNG ===== */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.seal{width:38px;height:38px;border-radius:50%;border:2px solid #E0574C;color:#F08A80;display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px;position:relative;flex:none}
.seal:after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed rgba(240,138,128,.55)}
.brand b{display:block;color:#fff;font-size:15px;font-weight:600;line-height:1.25}
.brand span{font-size:12px;color:var(--side-mute)}
.verl{display:inline-block;margin-top:3px;font-size:11.5px;color:#fff;opacity:.8;text-decoration:none;font-weight:600;border-bottom:1px dotted rgba(255,255,255,.5)}.verl:hover{opacity:1}

.course{margin:4px 12px 14px;background:var(--side2);border-radius:var(--r-lg);padding:12px 14px 12px}
.course .sel{display:flex;gap:6px;align-items:center}
.course select{flex:1;min-width:0;background:transparent;border:0;color:#fff;font-size:20px;font-weight:700;padding:0;cursor:pointer;appearance:none;-webkit-appearance:none}
.course select option{color:var(--ink);font-size:14px}
.course .chev{color:var(--side-mute);pointer-events:none}
.course dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 10px;font-size:12.5px}
.course dt{color:var(--side-mute)}
.course dd{margin:0;color:#E6EDF7;text-align:right}
.course dd.no{color:#F2A49B}
.course .acts{display:flex;gap:6px}
.sbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--side-ink);border-radius:7px;padding:5px 8px;font-size:12.5px;cursor:pointer}
.sbtn:hover{background:rgba(255,255,255,.07);color:#fff}

#tabs{display:flex;flex-direction:column;padding:0 10px;gap:1px}
.ngrp{font-size:11.5px;color:var(--side-mute);padding:12px 10px 5px}
#tabs button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--side-ink);padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left;font-size:13.5px;position:relative}
#tabs button:hover{background:rgba(255,255,255,.06);color:#fff}
#tabs button.on{background:#fff;color:var(--ink);font-weight:600}
#tabs button.on .num{background:var(--brand);color:#fff;border-color:var(--brand)}
#tabs .num{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--side-mute);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
#tabs .lbl{flex:1}
.badge{min-width:22px;padding:1px 7px;border-radius:10px;background:rgba(255,255,255,.1);font-size:11.5px;text-align:center;font-weight:500}
#tabs button.on .badge{background:var(--sunken);color:var(--ink2)}
.badge.r{background:var(--seal)!important;color:#fff!important}
.badge.z{visibility:hidden}

.sfoot{margin-top:auto;padding:14px 18px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--side-mute)}
.gfind{display:flex;align-items:center;gap:6px;margin:2px 10px 10px;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.gfind .ico{width:15px;height:15px;opacity:.7;flex:none;color:#fff}
#tabs .gfind input[type=text]{background:transparent;border:0;outline:0;box-shadow:none;color:#fff;font:inherit;font-size:13px;width:100%;padding:0;min-width:0;height:auto;border-radius:0}
#tabs .gfind input[type=text]::placeholder{color:rgba(255,255,255,.6)}
.sfoot .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#btnUndo{flex-basis:100%}

main{min-width:0;padding:22px 28px 40px}
.phead{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.phead h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.2px;line-height:1.2}
.phead p{margin:3px 0 0;color:var(--muted);max-width:95ch}
.phead .sp{flex:1}
#view{max-width:1400px}

/* ===== CẢNH BÁO ===== */
#alerts{max-width:1400px;margin-bottom:14px}
#alerts:empty{display:none}
.alist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.al{display:grid;grid-template-columns:4px 22px minmax(0,1fr) auto;align-items:center;gap:0 10px;padding:9px 14px 9px 0;border-top:1px solid var(--line2);cursor:pointer}
.al:first-child{border-top:0}
.al:hover{background:var(--hover)}
.al .bar{align-self:stretch;margin:-9px 0}
.al.over .bar{background:var(--seal)} .al.act .bar{background:#E8A33A} .al.next .bar{background:#9DB3D1}
.al.over .ic{color:var(--seal)} .al.act .ic{color:var(--amber)} .al.next .ic{color:var(--brand)}
.al .tx{min-width:0}
.al b{font-weight:600}
.al .sm{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .when{font-size:12.5px;font-weight:600;white-space:nowrap}
.al.over .when{color:var(--seal)} .al.act .when{color:var(--amber)} .al.next .when{color:var(--brand)}
.amore{display:block;width:100%;border:0;border-top:1px solid var(--line2);background:var(--sunken);padding:7px;font-size:12.5px;color:var(--brand);cursor:pointer}

/* ===== THÀNH PHẦN ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:15px;font-weight:600;margin:0 0 10px;color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
a{color:var(--brand)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap;line-height:1.3;transition:background .12s,border-color .12s}
.btn:hover{background:var(--sunken);border-color:#C3CCD8}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-ink)}
.btn.acc{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.acc:hover{background:var(--brand-ink)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:6px;gap:5px}
.btn.sm .ico{width:14px;height:14px}
.btn.loai{color:var(--seal);border-color:#EFC2BD;background:var(--surface)}
.btn.loai:hover{background:var(--seal-tint)}
.btn.unloai{background:var(--loai);border-color:var(--loai-line);color:#5C4700}
.btn.ico-only{padding:4px 6px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.stats{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
.stat{padding:11px 20px;border-right:1px solid var(--line2);min-width:120px}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:22px;font-weight:700;line-height:1.15;color:var(--ink)}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.y b{color:#8A6A00} .stat.y{background:linear-gradient(var(--loai),var(--loai)) left/3px 100% no-repeat}
.stat.r b{color:var(--seal)}

.drop{border:1.5px dashed #AFBACB;border-radius:var(--r-lg);padding:26px 20px;text-align:center;background:var(--sunken);cursor:pointer;transition:.15s;color:var(--ink2)}
.drop:hover,.drop.on{border-color:var(--brand);background:var(--brand-tint)}
.drop .big{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--brand);border:1px solid var(--line);margin-bottom:8px}
.drop .big .ico{width:22px;height:22px}
.drop b{color:var(--ink);font-weight:600;font-size:15px}
.drop .muted{display:block;max-width:72ch;margin:6px auto 0;font-size:13px}

table{border-collapse:separate;border-spacing:0;width:100%;background:var(--surface)}
th,td{padding:7px 10px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line2)}
th{background:var(--sunken);font-size:12px;font-weight:600;color:var(--ink2);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover td{background:var(--hover)}
td.c,th.c{text-align:center}
td.nm{font-weight:500}
tr.loai td{background:var(--loai)!important}
tr.loai td:first-child{box-shadow:inset 3px 0 0 var(--loai-line)}
tr.loai td.nm{text-decoration:line-through;text-decoration-color:#B08900}
tr.warn td.nm:after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#E8A33A;margin-left:7px;vertical-align:2px}
.tblwrap{padding:0;overflow:auto;max-height:calc(100vh - 120px)}
.tblwrap td{white-space:nowrap}
td.lo{white-space:normal!important;min-width:150px}
.why{display:block;margin:3px 0 0}
table.sum td,table.sum th{border-right:1px solid var(--line2)}
table.sum tr.tot td{background:var(--sunken)}
details.card summary{list-style-position:inside}
td.dc{max-width:250px;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.btn.danger{background:var(--seal);border-color:var(--seal);color:#fff}.btn.danger:hover{background:#912018}
.exlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:12px;max-height:268px;overflow:auto;padding:2px}
.exi{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.exi:hover{border-color:var(--brand);background:var(--hover)}
.exi.on{border-color:var(--brand);background:var(--brand-tint);box-shadow:inset 3px 0 0 var(--brand)}
.exi b{font-weight:700}.exi .d{color:var(--ink2);font-size:12.5px;text-align:right}
.exi .n{font-size:12.5px;color:var(--muted)}.exi .x{font-size:11.5px;color:var(--ok);text-align:right}.exi .x.no{color:var(--muted)}
.exi .c{grid-column:1/-1;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remind{border-color:#CADAF0;background:linear-gradient(90deg,var(--brand-tint),var(--surface) 55%)}
.rbell{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;flex:none}
.rbell .ico{width:20px;height:20px}
.popcard{position:fixed;right:20px;bottom:20px;width:380px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(17,42,74,.35);z-index:60;overflow:hidden;opacity:0;transform:translateY(16px);transition:.25s}
.popcard.on{opacity:1;transform:none}
.popcard .ph{display:flex;align-items:center;gap:8px;background:var(--side);color:#fff;padding:10px 12px}
.popcard .px{border:0;background:transparent;color:#fff;cursor:pointer;padding:2px}
.popcard .pb{padding:10px 14px;max-height:300px;overflow:auto}
.popcard .pi{border-left:4px solid #9DB3D1;padding:4px 0 4px 10px;margin-bottom:8px}
.popcard .pi.over{border-color:var(--seal)}.popcard .pi.act{border-color:#E8A33A}
.popcard .pi b{display:block;font-size:13.5px}.popcard .pi span{font-size:12.5px;color:var(--muted)}
.popcard .pi.over span{color:var(--seal);font-weight:600}.popcard .pi.act span{color:var(--amber);font-weight:600}
.popcard .pf{display:flex;gap:8px;justify-content:flex-end;padding:10px 12px;background:var(--sunken);border-top:1px solid var(--line2)}
.selbar{display:flex;align-items:center;gap:8px;position:sticky;top:8px;z-index:8;background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:8px 10px 8px 16px;margin-bottom:10px;box-shadow:0 6px 20px rgba(20,33,61,.25)}
.selbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.selbar .btn.danger{background:var(--seal);border-color:var(--seal)}
tr.picked td{background:#E3ECF8!important}
.asum{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--seal);border-radius:var(--r-lg);padding:9px 14px;box-shadow:var(--shadow);cursor:pointer}
.asum.act{border-left-color:#E8A33A}
.asum:hover{background:var(--hover)}
.asum .ic{color:var(--seal)} .asum.act .ic{color:var(--amber)}
.asum .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asum .go{color:var(--brand);font-weight:500;font-size:13px;white-space:nowrap}
.why{font-size:12px;color:#6E5600;margin-left:6px}

input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--surface);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-tint)}
.search{position:relative;display:inline-flex;align-items:center}
.search .ico{position:absolute;left:9px;color:var(--muted)}
.search input{padding-left:31px;min-width:280px}
textarea{width:100%;min-height:130px;font-family:Consolas,"Cascadia Mono",monospace;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px 18px}
.grid label{display:flex;flex-direction:column;font-size:12.5px;color:var(--ink2);gap:4px;font-weight:500}
.grid label input,.grid label select{font-size:14px;font-weight:400}
.imp{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600;background:var(--sunken);color:var(--ink2)}
.tag.moi{background:var(--brand-tint);color:var(--brand-ink)}.tag.tl{background:var(--amber-tint);color:var(--amber)}.tag.gplx{background:var(--ok-tint);color:var(--ok)}
.lv-err{color:var(--seal);font-weight:600}.lv-warn{color:var(--amber);font-weight:600}.lv-info{color:var(--brand);font-weight:600}
.gc{font-weight:600;padding:3px 6px;border-radius:6px;border:1px solid var(--line);min-width:148px}
.gc.empty{background:var(--seal-tint);border-color:#EFC2BD}
.note{background:var(--brand-tint);border:1px solid #CADAF0;border-radius:var(--r);padding:9px 13px;font-size:13px;color:var(--ink2);display:flex;gap:9px;align-items:flex-start}
.note .ico{margin-top:2px;color:var(--brand)}
.note.ok{background:var(--ok-tint);border-color:#B5DEC6}.note.ok .ico{color:var(--ok)}
.note.warn{background:var(--amber-tint);border-color:var(--amber-line)}.note.warn .ico{color:var(--amber)}
.sbdv{font-weight:700;color:var(--brand-ink);letter-spacing:.3px}

.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none;z-index:50;max-width:440px;box-shadow:0 8px 24px rgba(20,33,61,.25)}
.toast.on{opacity:1;transform:none}
dialog{border:0;border-radius:14px;padding:0;max-width:580px;width:calc(100% - 32px);box-shadow:0 24px 64px rgba(20,33,61,.3);color:var(--ink)}
dialog::backdrop{background:rgba(17,42,74,.45)}
dialog.wide{max-width:1180px}
dialog.xl{max-width:1360px;width:96vw}
.khv{margin-top:10px;overflow:auto}.khv table{border-collapse:collapse;width:100%;font-size:12.5px}.khv th,.khv td{border:1px solid var(--line);padding:4px 6px;text-align:center;font-weight:500}.khv th:first-child{text-align:left;white-space:nowrap;width:150px}
.khr{position:relative;height:30px;padding:0!important}.khb{position:absolute;top:6px;bottom:6px;border:1.6px solid #111;border-radius:2px;background:#fff}.khb.th{background:repeating-linear-gradient(90deg,#fff 0 calc(33.33% - 1.6px),#111 calc(33.33% - 1.6px) 33.33%)}
.tbp{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:18px;align-items:start}
.tbpL{max-height:calc(100vh - 210px);overflow:auto;padding-right:8px}
.tbpR{position:sticky;top:0;text-align:center}
.tbpR canvas{width:auto;max-width:100%;max-height:calc(100vh - 250px);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.12);background:#fff}
@media (max-width:900px){.tbp{grid-template-columns:1fr}.tbpL{max-height:none}}
#lock{position:fixed;inset:0;z-index:2000;background:#14213d;display:flex;align-items:center;justify-content:center}
#lock.hide{display:none}
.lockbox{background:#fff;border-radius:18px;padding:30px 28px;width:330px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.lockbox h2{margin:0 0 4px;font-size:18px}.lockbox input{width:100%;font-size:22px;letter-spacing:6px;text-align:center;margin:16px 0 10px;padding:10px;border:1px solid var(--line);border-radius:10px}
body.locked #dlg{display:none}
.uinfo a,#drvInfo a{color:inherit;text-decoration:none}.uinfo a:hover,#drvInfo a:hover{text-decoration:underline}.uinfo .ico{width:12px;height:12px;vertical-align:-2px}
.fprev{max-height:30vh;overflow:auto;border:1px solid var(--line2);border-radius:8px;background:#fff;margin-top:6px}
.fprev table{border-collapse:collapse;font:12px 'Times New Roman',serif;color:#000}
.fprev td{border:1px solid #e3e3e3;padding:2px 5px;white-space:pre;vertical-align:middle;min-width:18px;max-width:420px;overflow:hidden}
.fprev td.w{white-space:pre-wrap}
.fprev td.rn{background:#f3f3f3;color:#888;font:10px sans-serif;text-align:center}
dialog .hd{padding:16px 20px 4px;font-weight:700;font-size:16px}
dialog .bd{padding:10px 20px 18px}
dialog.wide .bd{max-height:calc(100vh - 170px);overflow:auto}
dialog .ft{padding:12px 20px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;background:var(--sunken)}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.reasons button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;cursor:pointer}
.reasons button.on{background:var(--seal);color:#fff;border-color:var(--seal)}
details summary{cursor:pointer}

/* ===== LỊCH NỘP ===== */
.tl{position:relative;padding-left:28px}
.tl:before{content:"";position:absolute;left:9px;top:10px;bottom:10px;width:2px;background:var(--line)}
.ms{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.ms:before{content:"";position:absolute;left:-25px;top:18px;width:12px;height:12px;border-radius:50%;background:#B8C3D3;box-shadow:0 0 0 4px var(--bg)}
.ms.done:before{background:var(--ok)} .ms.act:before{background:#E8A33A} .ms.over:before{background:var(--seal)}
.ms.over{border-color:#EFC2BD} .ms.act{border-color:var(--amber-line)}
.ms h3{margin:0;font-size:15px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ms .when{font-size:12.5px;color:var(--muted);margin:3px 0 8px}
.st{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:10px}

    seq:1, students:[], gplx:{}, conflicts:[], log:[]};
}
function load(){ try{ const s=localStorage.getItem(LS); if(s) return JSON.parse(s);}catch(e){} return null; }
/* ===== LƯU 2 NƠI: localStorage (nhanh, ~5 MB) + IndexedDB (kho lớn, dự phòng) =====
   Mở tool: lấy bản MỚI NHẤT giữa 2 nơi (theo DB._t). Nơi nào lỗi/đầy thì vẫn còn nơi kia. */
const IDBN='TOOLS_BC1_BC2_SBD', IDBS='kv'; let idbP=null;
function idb(){ if(!idbP) idbP=new Promise((res,rej)=>{ try{ const r=indexedDB.open(IDBN,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(IDBS); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return idbP; }
async function idbGet(k){ const d=await idb(); return new Promise((res,rej)=>{ const q=d.transaction(IDBS).objectStore(IDBS).get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbSet(k,v){ const d=await idb(); return new Promise((res,rej)=>{ const t=d.transaction(IDBS,'readwrite'); t.objectStore(IDBS).put(v,k); t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
const STORE={ls:null, idb:null, size:0, warned:false};
let saveT=null;
function writeNow(){
  try{ audFlush(); }catch(e){ logErr('Nhật ký thay đổi: '+e.message,'audFlush'); }
  DB._t=Date.now(); const j=JSON.stringify(DB); STORE.size=j.length;
  try{ localStorage.setItem(LS,j); STORE.ls=true; }catch(e){ STORE.ls=false; }
  idbSet('db',j).then(()=>{ STORE.idb=true; showStore(); }).catch(()=>{ STORE.idb=false; showStore(); });
  showStore();
  if(!DRV.quiet) drvSchedule();
}
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ saveT=null; writeNow(); },250); }
function showStore(){
  const t=new Date().toLocaleTimeString('vi-VN');
  if(STORE.ls===false&&STORE.idb===false){ setStatus('⚠ KHÔNG LƯU ĐƯỢC — bấm Sao lưu ngay'); $('#status').style.color='#ffb4a8';
    if(!STORE.warned){ STORE.warned=true; dialog('Trình duyệt không cho lưu dữ liệu',`<div class="note warn">${ic('alert')}<span>Thay đổi vừa rồi <b>chưa được lưu</b> vào trình duyệt (bộ nhớ đầy hoặc bị chặn). Bấm <b>Sao lưu</b> ngay để giữ dữ liệu ra file.</span></div>`,[['Sao lưu ngay','pri',()=>{ $('#btnBackup').click(); }],['Để sau','']]); }
    return; }
  $('#status').style.color='';
  setStatus(`Đã tự lưu ${t}`+(STORE.ls===false?' (kho dự phòng — bộ nhớ chính đã đầy)':''));
}
function normalizeDB(){
  if(!DB||!DB.courses||!Object.keys(DB.courses).length){ const c=defCourse(); DB={courses:{[c.id]:c},cur:c.id}; }
  if(!DB.courses[DB.cur]) DB.cur=Object.keys(DB.courses)[0];
  if(!DB.mocTpl) DB.mocTpl=JSON.parse(JSON.stringify(MOC_DEFAULT));
  (DB.exams||[]).forEach(e=>e.rows.forEach(r=>{ if(r.cmt==null) r.cmt=r.id||''; if(!r.flags) r.flags=[]; }));
  DB.mocTpl.forEach(m=>{ if(!m.base) m.base='kg'; });
  migrateMoc();
  Object.values(DB.courses).forEach(c=>sortRuleOf(c));
}
/* sau khi mở tool: so với IndexedDB, lấy bản mới hơn; xin trình duyệt giữ dữ liệu lâu dài */
async function syncStore(){
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  let j=null; try{ j=await idbGet('db'); STORE.idb=true; }catch(e){ STORE.idb=false; return; }
  const cur=DB&&DB._t||0;
  if(j){ let d=null; try{ d=JSON.parse(j); }catch(e){}
    if(d&&d.courses&&(d._t||0)>cur){ DB=d; normalizeDB(); try{ localStorage.setItem(LS,JSON.stringify(DB)); }catch(e){ STORE.ls=false; } render();
      toast(cur?'Đã lấy bản dữ liệu mới hơn từ kho dự phòng.':'Đã khôi phục dữ liệu từ kho dự phòng (bộ nhớ chính bị trống).',5000); }
    else if(cur>(d&&d._t||0)) idbSet('db',JSON.stringify(DB)).catch(()=>{}); }
  else idbSet('db',JSON.stringify(DB)).catch(()=>{});
  try{ const h=await idbGet('hist'); if(h){ const H=JSON.parse(h); if(Array.isArray(H)&&H.length&&(!HIST.length||H[H.length-1].t>HIST[HIST.length-1].t)){ HIST=H; render(); } } }catch(e){}
}

  ['4.5','16/10/2026',['Dữ liệu & bảo mật: khu “Thư mục sao lưu” — xem danh sách file trong thư mục sao lưu (bản mới nhất, bản theo ngày, thủ công, trước nâng cấp, hồ sơ từng khóa), xem & khôi phục, tải, xóa bản cũ; ghi và sao chép đường dẫn thư mục để mở bằng File Explorer',

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const norm=s=>strip(s).toLowerCase().replace(/[\r\n\t]+/g,' ').replace(/\s+/g,' ').trim();
const tenOf=n=>{const p=String(n||'').trim().split(/\s+/);return p[p.length-1]||'';};
/* ===== SẮP XẾP THEO BẢNG CHỮ CÁI TIẾNG VIỆT =====
   Thứ tự khóa: TÊN RIÊNG → HỌ → TÊN ĐỆM.
   Mỗi khóa nhớ quy tắc riêng (c.sortRule) để BC2 luôn cùng thứ tự với BC1 đã nộp:
     v2 (từ bản 2.5): A=Ă=Â, D=Đ, U=Ư tính chung, không phân biệt
     v1 (trước 2.5) : a ă â b c d=đ … u ư (chỉ D/Đ tính chung; không mũ trước, có mũ sau)
   Dấu thanh (so sau khi chữ cái bằng nhau): không dấu < huyền < sắc < hỏi < ngã < nặng. */
const VN_ALPHA=['A','Ă','Â','B','C','D','Đ','E','Ê','F','G','H','I','J','K','L','M','N','O','Ô','Ơ','P','Q','R','S','T','U','Ư','V','W','X','Y','Z'];
const VN_RANK=Object.fromEntries(VN_ALPHA.map((ch,i)=>[ch,String.fromCharCode(65+i)]));
VN_RANK['Đ']=VN_RANK['D'];                                   // v1: chỉ D/Đ tính chung
const VN_RANK2={...VN_RANK, 'Ă':VN_RANK['A'], 'Â':VN_RANK['A'], 'Ư':VN_RANK['U']};   // v2: thêm A/Ă/Â và U/Ư tính chung
const SORT_RULES={
  v3:'Mới (bản 2.9): A/Ă/Â, D/Đ, U/Ư tính chung — nếu bằng nhau thì chữ không mũ trước (AN trước ÂN)',
  v2:'Bản 2.5: A/Ă/Â, D/Đ, U/Ư tính chung (AN, ÂN bằng nhau → so họ)',
  v1:'Quy tắc cũ: chỉ D/Đ tính chung — A trước Ă trước Â, U trước Ư'};
const RULE_NEW='v3';
function sortRuleOf(c){ c=c||C();
  const done=c.lastBC1||(c.students||[]).some(s=>(s.srcs||[]).includes('bc1'));
  if(!c.sortRule) c.sortRule=done?'v1':RULE_NEW;
  else if(c.sortRule==='v2'&&!done&&!c.sortRuleSet) c.sortRule=RULE_NEW;   // khóa chưa xuất BC1 → tự lên quy tắc theo mẫu
  return c.sortRule; }
const TONE={'̀':1,'́':2,'̉':3,'̃':4,'̣':5}; // huyền, sắc, hỏi, ngã, nặng
const MODS={'̆':1,'̂':1,'̛':1};                     // ă â ê ô ơ ư (giữ lại làm chữ riêng)
/* v3 (bản 2.9) = quy tắc bản 2.5 (A/Ă/Â, D/Đ, U/Ư tính chung; không dấu < huyền < sắc < hỏi < ngã < nặng)
   + NGOẠI LỆ: nếu một chữ (tên/họ/đệm) bằng nhau cả chữ lẫn dấu thanh, chỉ khác mũ → chữ KHÔNG mũ đứng trước
     (AN trước ĂN trước ÂN; U trước Ư), rồi mới so tiếp họ / tên đệm. D và Đ vẫn coi như nhau hoàn toàn. */
function wordKey3(w){
  const [L,tone]=wordKey(w,'v2');
  const base=String(w).toUpperCase().normalize('NFD').replace(/[\u0300\u0301\u0303\u0309\u0323]/g,'').normalize('NFC');
  let hats=''; for(const ch of base) hats+= ch==='Ă'?'1':ch==='Â'?'2':ch==='Ư'?'1':'0';
  return [L,tone,hats];
}
function wordKey(w,rule){
  if(rule==='v3') return wordKey3(w);
  const RK=rule==='v1'?VN_RANK:VN_RANK2;
  let letters='', tone=0;
  const d=String(w).toUpperCase().normalize('NFD');
  for(const ch of d){
    if(TONE[ch]){ tone=TONE[ch]; continue; }
    if(MODS[ch]){ letters+=ch; continue; }
    letters+=ch;
  }
  // gộp lại chữ cái có mũ/râu (Ă Â Ê Ô Ơ Ư), rồi quy đổi sang hạng chữ cái
  const base=letters.normalize('NFC'); let L='';
  for(const ch of base) L+= RK[ch] || ('~'+ch);
  return [L,tone];
}
const KEYCACHE=new Map();
function nameKey(n,rule){
  const full=String(n||'').trim().replace(/\s+/g,' '), ck=rule+'|'+full;
  if(KEYCACHE.has(ck)) return KEYCACHE.get(ck);
  const p=full? full.split(' ') : [];
  const ten=p.length?p[p.length-1]:'', ho=p.length>1?p[0]:'', dem=p.length>2?p.slice(1,-1):[];
  const k={ten:wordKey(ten,rule), ho:wordKey(ho,rule), dem:dem.map(x=>wordKey(x,rule))};
  KEYCACHE.set(ck,k); return k;
}
const cmpS=(a,b)=>a<b?-1:a>b?1:0;
function cmpWord(a,b){ for(let i=0;i<a.length;i++){ const r=cmpS(a[i],b[i]); if(r) return r; } return 0; }
function cmpWordList(A,B){
  for(let i=0;i<Math.min(A.length,B.length);i++){ const r=cmpWord(A[i],B[i]); if(r) return r; }
  return A.length-B.length;
}
function cmpWith(rule){ return (a,b)=>{ const ka=nameKey(a.ten,rule), kb=nameKey(b.ten,rule);
  return cmpWord(ka.ten,kb.ten) || cmpWord(ka.ho,kb.ho) || cmpWordList(ka.dem,kb.dem) || (a.ord-b.ord); }; }
/* số người đổi vị trí nếu chuyển quy tắc (BC1 và danh sách thi lại) */
function ruleDiff(c,to){
  const cnt=L=>{ const A=L.slice().sort(cmpWith(sortRuleOf(c))), B=L.slice().sort(cmpWith(to)); return A.filter((x,i)=>x!==B[i]).length; };
  return {bc1:cnt(c.students.filter(s=>s.loai==='moi')), tl:cnt(c.students.filter(s=>s.loai==='tl'))};
}

  return `<div class="note warn" style="margin-bottom:14px;align-items:center">${ic('alert')}<span style="flex:1">Khóa này đang sắp theo <b>${r==='v1'?'quy tắc cũ':'quy tắc bản 2.5'}</b>${r==='v1'&&c.lastBC1?' (đã xuất BC1 trước khi đổi quy tắc)':''}. Áp quy tắc mới sẽ đổi vị trí <b>${d.bc1}</b> người ở BC1 và <b>${d.tl}</b> người ở danh sách thi lại.</span>
    <button class="btn pri sm" onclick="askRule('${RULE_NEW}')">Áp dụng quy tắc mới &amp; sắp lại</button></div>`;

function askRule(to){

  let s=String(v).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[3]+'/'+m[2]+'/'+m[1];
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/))) return pad(m[1],2)+'/'+pad(m[2],2)+'/'+m[3];

/* Nội dung thi lại: mã lưu trong tool → chữ hiển thị / in ra */

/* ================== ĐỌC FILE EXCEL ================== */
const KW={ten:['ho va ten','ho ten'], ns:['ngay sinh','nam sinh'], id:['so chung minh','cccd','so dinh danh','cmnd','so cmt'],
  dc:['noi cu tru','noi thuong tru','dia chi'], sk:['cnsk','chung nhan suc khoe'],
  hang:['hang gplx da co','da co giay phep lai xe hang','hang giay phep lai xe da co'],
  sogplx:['so gplx','so giay phep lai xe'], madk:['ma dang ky'], sohs:['so ho so'], gc:['ghi chu'], ngaycap:['ngay cap'], ngayhh:['ngay het han','het han su dung','co gia tri den'], sbd:['so bao danh','sbd'], nd:['noi dung sat hach'], ndtl:['noi dung sh lai']};
function mapHeader(rows){
  for(let r=0;r<Math.min(rows.length,25);r++){
    const map={};
    rows[r].forEach((v,c)=>{ const n=norm(v); if(!n) return;
      for(const k in KW){ if(map[k]==null && KW[k].some(w=>n.includes(w))) map[k]=c; }
      if(n==='hang' && map.hangG==null) map.hangG=c; });
    if(map.ten!=null && (map.id!=null||map.sbd!=null)) return {r,map};
  }
  return null;
}
function isYellow(cell){
  const s=cell&&cell.s; if(!s) return false;
  const rgb=(s.fgColor&&s.fgColor.rgb)||(s.bgColor&&s.bgColor.rgb)||'';
  return /FFFF00$/i.test(rgb)||/FFFF66$/i.test(rgb)||/FFFF99$/i.test(rgb);

async function analyzeFile(file){
  const buf=await file.arrayBuffer();

  const pnL=parseName(file.name); if(pnL&&pnL.rule&&pnL.rule.id==='tlr') return analyzeLoc(wb,file);
  if(pnL&&pnL.rule&&pnL.rule.id==='thithu') return analyzeThiThu(wb,file,pnL);
  const isGLD=!!(pnL&&pnL.rule&&pnL.rule.id==='sbd');   // Số báo danh: CHỈ nạp từ file tên GLĐ…
  const fnorm=norm(file.name).replace(/_/g,' ');
  const out=[], sbdIgnored=[];
  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn]; if(!ws||!ws['!ref']) continue;
    const rg=XLSX.utils.decode_range(ws['!ref']);
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:'',blankrows:true});
    const h=mapHeader(rows); if(!h) continue;
    const {r:hr,map}=h;
    const top=norm(rows.slice(0,hr+1).flat().join(' '));
    let kind='skip', target='moi';
    if(map.sbd!=null){ if(!isGLD){ sbdIgnored.push(sn); continue; } kind='sbd'; }
    else if(isGLD) continue;            // file GLĐ: chỉ lấy sheet danh sách thi
    else if(map.ndtl!=null) kind='loctl';
    else if(map.ngaycap!=null || (map.sogplx!=null && map.hangG!=null && map.dc==null)) kind='gplx';
    else if(map.madk!=null){ kind='hoso'; target=/thi lai|\btl\b/.test(fnorm)?'tl':'moi'; }
    else if(top.includes('danh sach hoc vien') && map.sogplx!=null && /hang\s*:?\s*a1\b/.test(top)){ kind='bc1'; target='moi'; }
    else if(/hang\s*:?\s*a1\b/.test(top) && map.dc!=null){ kind='bc2'; target=(/-?tl$/i.test(sn.trim())||/sh lai/.test(norm(rows.slice(hr+1,hr+30).map(x=>x[map.gc]).join(' '))))?'tl':'moi'; }
    if(kind==='skip') continue;
    const recs=[], skipped=[], seen={};
    const cellAt=(r,c)=>c==null?null:ws[XLSX.utils.encode_cell({r:rg.s.r+r,c:rg.s.c+c})];
    const txtAt=(r,c)=>{ const x=cellAt(r,c); if(!x||x.v==null) return ''; if(typeof x.v==='number') return String(x.v); return String(x.v).replace(/^\s+|\s+$/g,''); };
    for(let r=hr+1;r<rows.length;r++){
      const row=rows[r]; const id=normId(row[map.id]); const ten=String(row[map.ten]||'').trim();
      if(kind==='sbd'){
        // Giữ NGUYÊN giá trị gốc của file phòng thi; chỉ chuyển kiểu khi ô là số và ghi lại cảnh báo
        const flags=[];
        const sbX=cellAt(r,map.sbd); let sb=txtAt(r,map.sbd); if(sbX&&typeof sbX.v==='number'&&Number.isInteger(sbX.v)) sb=String(sbX.v);
        const tenR=txtAt(r,map.ten);
        const cX=cellAt(r,map.id); let cmt=txtAt(r,map.id);
        if(cX&&typeof cX.v==='number'){ cmt=String(Math.round(cX.v)); if(cmt.length===11||cmt.length===8){ cmt='0'+cmt; flags.push('Số CMT lưu dạng số trong file gốc — đã bổ sung số 0 ở đầu'); } }
        const nX=cellAt(r,map.ns); let ns=txtAt(r,map.ns);
        if(nX&&typeof nX.v==='number'){ ns=fmtDate(nX.v); flags.push('Ngày sinh lưu dạng số trong file gốc — đã chuyển sang dd/mm/yyyy'); }
        const hang=txtAt(r,map.hangG!=null?map.hangG:map.hang), nd=txtAt(r,map.nd!=null?map.nd:map.gc);
        if(!tenR&&!cmt) continue;                      // dòng trống / dòng nhóm “Hạng A1m:” / chữ ký
        const miss=[!sb&&'SBD',!tenR&&'họ tên',!cmt&&'số CMT'].filter(Boolean);
        if(miss.length){ skipped.push({row:rg.s.r+r+1, ten:tenR, id:cmt, reason:'Thiếu '+miss.join(', ')}); continue; }
        recs.push({sbd:sb, ten:tenR, cmt, id:normId(cmt), ns, hang, nd, flags, row:rg.s.r+r+1}); continue; }
      if(!ten&&!String(row[map.id]??'').trim()) continue;
      if(/^\(\d+\)$/.test(ten)) continue;   // dòng đánh số cột (1) (2) (3)…
      if(!ten||!/^\d{8,13}$/.test(id)){ skipped.push({row:rg.s.r+r+1, ten, id:String(row[map.id]??''), reason:!ten?'Thiếu họ tên':'Số định danh không hợp lệ'}); continue; }

        hang:String(g('hang')||'').trim(), sogplx:String(g('sogplx')||'').trim().replace(/\.0+$/,''), madk:String(g('madk')||'').trim(),

      if(kind==='bc1'){
        const R=rg.s.r+r; let y=false;
        for(let c=0;c<8;c++){ if(isYellow(ws[XLSX.utils.encode_cell({r:R,c:rg.s.c+c})])){y=true;break;} }
        const L=String(row[11]||'').trim();
        rec.loai=y||!!L; rec.lyDo=L&&!/^x$/i.test(L)?L:(y||L?'Loại (theo BC1 đã làm)':'');
      }
      if(kind==='bc2'){
        rec.gcTL=/sh lai/.test(norm(rec.gc))? parseGC(rec.gc) : '';
        const o=row[14]; rec.phuTrach=(typeof o==='string'&&o.trim().length<=20&&!/^\d+$/.test(o.trim()))?o.trim():'';
      }
      recs.push(rec);
    }
    if(kind==='loctl') target='gcfill';
    const item={file:file.name, sheet:sn, kind, target, recs, skipped};
    if(kind==='sbd'){
      const cells=rows.slice(0,hr).flat().map(v=>String(v??'').trim()).filter(Boolean);
      const kt=cells.map(v=>v.match(/[A-ZĐ]{2,5}-\d{4}-K\d+/)).find(Boolean);
      const nt=cells.map(v=>v.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/)).find(Boolean);

      // “Tổng số” ghi trên đầu file để đối chiếu số dòng
      for(const row of rows.slice(0,hr)){ const i=row.findIndex(v=>/^tong so/.test(norm(v))); if(i<0) continue;

    if(ex.length>1) ex.forEach(x=>{ x.target='skip'; x.userLock=true; x.nameMsg=`File có ${ex.length} sheet danh sách thi — mỗi khóa thi chỉ được 1 file / 1 danh sách. Không nạp, kiểm tra lại file.`; });

/* ===== FILE _LOCTL: không theo khuôn mẫu — chỉ cần CỘT SỐ CCCD + CỘT NỘI DUNG SH LẠI =====

   sheet nào phần lớn là nội dung SH lại thì dùng; sheet khác (bảng tổng hợp…) mặc định bỏ qua.

const isIdV=v=>/^(\d{9}|\d{12})$/.test(normId(v));

function locSheetInfo(ws){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:'',blankrows:true});
  const ncol=rows.reduce((m,r)=>Math.max(m,r.length),0);
  let hr=-1, id=null, nd=null, ten=null;
  for(let r=0;r<Math.min(rows.length,25)&&hr<0;r++){
    let i=null,n=null,nSh=null,t=null;
    rows[r].forEach((v,c)=>{ const x=norm(v); if(!x||x.length>60) return;
      if(i==null&&(KW.id.some(w=>x.includes(w))||/^(so )?(cccd|cmt|cmnd|dinh danh)$/.test(x))) i=c;
      if(/noi dung/.test(x)){ if(/sh lai|thi lai/.test(x)){ if(nSh==null) nSh=c; } else if(n==null) n=c; }

  // không có tiêu đề → nhận theo giá trị trong cột
  const data=rows.slice(hr+1);
  const best=test=>{ let bc=null,bn=0; for(let c=0;c<ncol;c++){ const vals=data.map(r=>r[c]).filter(v=>String(v).trim()!==''); const k=vals.filter(test).length;
      if(k>bn&&k>=Math.max(3,vals.length*0.6)){ bn=k; bc=c; } } return bc; };
  const idBy=id==null, ndBy=nd==null;
  if(id==null) id=best(isIdV);
  if(nd==null) nd=best(v=>!!parseGC(v,true));
  return {rows, ncol, hr, id, nd, ten, idBy, ndBy};
}
function locBuild(file, sn, info){
  const {rows,id,nd,ten}=info; const recs=[], skipped=[], seen={}; let bad=0;
  for(let r=info.hr+1;r<rows.length;r++){
    const row=rows[r], rawId=String(row[id]??'').trim(), rawNd=String(row[nd]??'').trim(), nm=ten!=null?String(row[ten]||'').trim():'';
    if(!rawId&&!rawNd) continue;
    const cc=normId(rawId), gc=parseGC(rawNd,true), line=r+1;
    if(!isIdV(rawId)){ if(gc) skipped.push({row:line, ten:nm, id:rawId, reason:rawId?'Số CCCD không hợp lệ':'Thiếu số CCCD'}); continue; }
    if(!gc){ bad++; skipped.push({row:line, ten:nm, id:cc, reason:rawNd?`Nội dung “${rawNd}” không phải SH lại LT / H / LT + H`:'Cột nội dung để trống'}); continue; }
    if(seen[cc]){ const f=seen[cc];
      if(f.gcTL!==gc){ skipped.push({row:line, ten:nm, id:cc, reason:`Trùng số CCCD với dòng ${f.row} nhưng nội dung khác (${GC_LABEL[f.gcTL]} / ${GC_LABEL[gc]}) — KHÔNG điền người này, kiểm tra lại file`}); f.conflict=true; }
      continue; }
    const rec={id:cc, ten:nm, ns:'', dc:'', ndRaw:rawNd, gcTL:gc, row:line}; seen[cc]=rec; recs.push(rec);
  }
  const ok=recs.filter(r=>!r.conflict);
  const fit=ok.length>0 && ok.length>=0.8*(ok.length+bad);
  const cols=`cột số CCCD: ${colName(id)}, cột nội dung: ${colName(nd)}${ten!=null?`, cột tên: ${colName(ten)}`:''}`;
  return {file:file.name, sheet:sn, kind:'loctl', target:fit?'gcfill':'skip', recs:ok, skipped:fit?skipped:[],
    note: fit? cols : `Bỏ qua mặc định: chỉ ${ok.length}/${ok.length+bad} dòng là nội dung SH lại (phần lớn là “${(rows.slice(info.hr+1).map(r=>String(r[nd]??'').trim()).find(v=>v&&!parseGC(v,true))||'khác')}”) — có vẻ là bảng tổng hợp, không phải danh sách đã lọc`};
}
function analyzeLoc(wb, file){
  const out=[], miss=[];
  for(const sn of wb.SheetNames){ const ws=wb.Sheets[sn]; if(!ws||!ws['!ref']) continue;
    const info=locSheetInfo(ws); if(!info.rows.some(r=>r.some(v=>String(v).trim()!==''))) continue;
    if(info.id==null||info.nd==null){ miss.push({sn, info}); continue; }
    const it=locBuild(file, sn, info); if(it.recs.length||it.skipped.length) out.push(it); else miss.push({sn,info});
  }
  if(!out.some(x=>x.target!=='skip')) return askLocCols(wb, file, out, miss);
  return out;
}
/* Hỏi lại người nạp: chỉ ra thiếu cột nào, cho chọn cột tay hoặc bỏ file */

        const it=locBuild(file, n, i); if(!it.recs.length){ alert('Với 2 cột này không có dòng nào có số CCCD hợp lệ và nội dung SH lại. Chọn lại cột.'); return false; }

function locDiff(p){
  const c=C(), ids=new Set(p.recs.map(r=>r.id)), D={changed:[],fill:[],same:0,gone:[]};
  for(const r of p.recs){ const s=c.students.find(x=>x.cccd===r.id); if(!s||s.loai!=='tl') continue;
    if(s.gcTL===r.gcTL) D.same++; else if(!s.gcTL) D.fill.push({s,r}); else D.changed.push({s,r}); }
  D.gone=c.students.filter(s=>s.loai==='tl'&&s.gcSrc==='file'&&s.gcTL&&!ids.has(s.cccd));
  return D;
}

    <ul style="margin:10px 0 0;padding-left:20px;line-height:1.8">

      <li><b>${D.fill.length}</b> người trước đó chưa có nội dung, nay được điền${D.fill.length?lst(D.fill,x=>`${esc(x.s.ten)}: <b>${GC_LABEL[x.r.gcTL]}</b>`):''}</li>
      <li><b>${D.same}</b> người giống nội dung cũ</li>
      ${D.gone.length?`<li style="color:var(--amber)"><b>${D.gone.length}</b> người có nội dung từ file lần trước nhưng <b>không có trong file mới</b> — giữ nguyên nội dung cũ, nên kiểm tra${lst(D.gone,s=>`${esc(s.ten)}: ${GC_LABEL[s.gcTL]}`)}</li>`:''}
    </ul>

    [['Không — giữ nội dung cũ','',()=>{ locs.forEach(p=>p.target='skip'); if(pending.some(p=>p.target!=='skip')) setTimeout(applyImport,0); else { pending=[]; renderPending(); toast('Không thay đổi — giữ nguyên nội dung SH lại cũ.'); } }],
     ['Cập nhật theo file mới','pri',()=>{ setTimeout(applyImport,0); }]]);

function applyImport(){

    if(p.kind==='xml'){ applyXML(p, conf); continue; }

    if(p.target==='tlr'){
      const ids=new Set(p.recs.map(r=>r.id)); let out=0;

        if(ids.has(s.cccd)&&s.biLoai&&s.lyDo==='Không có trong file thi lại đã lọc'){ s.biLoai=false; s.lyDo=''; } }
      if(out) conf.push(`Thay danh sách thi lại theo “${p.file}”: ${out} người cũ không còn trong file → đã chuyển sang LOẠI (bỏ loại được nếu nhầm).`);
    }
    if(p.target==='gplx'){
      for(const r of p.recs){ c.gplx[r.id]={so:r.sogplx, hang:r.hangG||r.hang, ten:r.ten, cap:r.cap||'', hh:r.hh||''}; g++; }
      continue;
    }
    const src=p.kind;
    for(const r of p.recs){
      let s=c.students.find(x=>x.cccd===r.id);
      if(!s){ s={cccd:r.id, loai:p.target==='tlr'?'tl':p.target, ord:c.seq++, srcs:[], biLoai:false, lyDo:'', gcTL:'', phuTrach:'', sbd:'',
                 ten:'',ns:'',dc:'',sk:'',hangHS:'',soGPLX:'',maDK:'',soHS:''}; c.students.push(s); add++; }
      else { upd++; if(s.loai!==(p.target==='tlr'?'tl':p.target)){ conf.push(`${upper(r.ten)} (${r.id}): đang ở danh sách ${s.loai==='moi'?'HỌC MỚI':'THI LẠI'}, file “${p.file}” lại xếp vào ${p.target==='moi'?'HỌC MỚI':'THI LẠI'} — giữ nguyên, cần kiểm tra.`);} }
      const strong = src==='hoso';
      const set=(k,v)=>{ if(v!==''&&v!=null && (strong||!s[k])) s[k]=v; };
      set('ten',upper(r.ten)); set('ns',r.ns); set('dc',r.dc); set('sk',r.sk||(strong?'':'x')); set('hangHS',r.hang);
      set('soGPLX',r.sogplx); set('maDK',r.madk); set('soHS',r.sohs);
      if(r.gc && s.loai==='tl' && strong){ const g=parseGC(r.gc); if(g) s.gcTL=g; }
      if(!s.srcs.includes(src)) s.srcs.push(src);

      if(src==='bc2'){ if(r.gcTL&&!s.gcTL) s.gcTL=r.gcTL; if(r.phuTrach&&!s.phuTrach) s.phuTrach=r.phuTrach; }
    }
  }
  applyGPLX();
  c.conflicts=[...(c.conflicts||[]),...conf];
  c.log.push({t:new Date().toISOString(), files:pending.filter(p=>p.target!=='skip').map(p=>p.file+' / '+p.sheet+' → '+p.target), u:userName()});
  pending=[]; save();
  { const cid=c.id; impFiles.forEach(f=>f.arrayBuffer().then(b=>arcAdd('nap',f.name,b,cid)).catch(()=>{})); }
  toast(`Đã nạp: +${add} người mới, cập nhật ${upd}, ${g} GPLX tra cứu${conf.length?`, ${conf.length} ghi chú (xem mục Kiểm tra dữ liệu)`:''}.`,4000);

}
/* ===== KHÓA THI (file máy chủ phòng thi lý thuyết) ===== */
/* Nội dung sát hạch trong file phòng thi:
   'SH lần đầu'            → thi mới (cột Lý thuyết, trừ khi đã có GPLX)
   'Sát hạch H'            → thi mới, đã có GPLX ô tô → chỉ thi Hình (cột Hình)
   'SH lại LT/H/LT + H'    → thi lại */
function ndClass(nd){
  const n=norm(nd);
  if(/lan dau/.test(n)) return 'moi';
  if(/^(sat hach|sh)\b/.test(n) && !/lai/.test(n)){ const t=n.replace(/^(sat hach|sh)/,'').replace(/\s/g,'');
    if(t==='h') return 'moiH'; if(/^lt?$/.test(t)||/^lt?\+h$/.test(t)) return 'moi'; }
  if(/lai/.test(n)){ const t=n.replace(/sh\s*lai/,'').replace(/\s/g,'');
    if(t.includes('+')||(t.includes('l')&&t.includes('h'))) return 'LH';
    if(t.startsWith('l')) return 'L'; if(t.startsWith('h')) return 'H'; }
  return '?';
}
/* Đối chiếu thí sinh với dữ liệu tool CHỈ theo số CMT (không đoán theo tên) */
function findPerson(id){
  if(!id) return null;
  for(const c of Object.values(DB.courses)){ const s=c.students.find(x=>x.cccd===id); if(s) return {s,c}; }
  return null;
}
function gplxHang(r){
  const f=findPerson(r.id);
  if(f&&(f.s.hangHS||f.s.hangG)) return f.s.hangHS||f.s.hangG;
  for(const c of Object.values(DB.courses)){ const g=r.id&&c.gplx[r.id]; if(g&&g.hang) return g.hang; }
  return '';
}
/* ===== DS THÍ SINH CÓ GPLX (mục Số báo danh) — xuất riêng, không đụng BC1 / BC2 / DS SBD =====
   Lấy đúng những người có “Hạng GPLX đã có” trong danh sách SBD, giữ nguyên thứ tự file phòng thi;
   số GPLX, ngày cấp, ngày hết hạn lấy theo file GPLX_<khóa> đã nạp. */
/* chỉ dùng khi file GPLX không có sẵn ngày hết hạn: theo Luật TTATGTĐB 36/2024 (giống công thức trong file GPLX) */
function gplxHanTinh(hang,cap){
  const d=parseVN(cap), h=String(hang||'').toUpperCase().trim(); if(!d||!h) return '';
  const y=['B','B1','B2','C1'].includes(h)?10:['C','C1E','CE','D','D1','D2','D1E','D2E','DE','BE','E'].includes(h)?5:0;
  if(!y) return ''; return pad(d.getDate(),2)+'/'+pad(d.getMonth()+1,2)+'/'+(d.getFullYear()+y);
}
/* tra GPLX của 1 người trên MỌI dữ liệu đã nhập: file GPLX của mọi khóa + file GPLX bổ sung (khóa trước) + hồ sơ các khóa.
   Ưu tiên bản có ngày cấp; nhiều bản thì lấy khóa khai giảng gần nhất. */
function gplxLookup(id){
  if(!id) return null;
  const cand=[];
  for(const c of Object.values(DB.courses)){ const g=c.gplx&&c.gplx[id]; if(g&&(g.so||g.hang)) cand.push({...g,src:'GPLX '+c.ten,o:c.khaiGiang||''}); }
  const p=(DB.gplxPool||{})[id]; if(p) cand.push({...p,src:'GPLX bổ sung: '+p.file,o:'9999'});
  cand.sort((x,y)=>(!!y.cap-!!x.cap)||(!!y.hh-!!x.hh)||y.o.localeCompare(x.o));
  let g=cand[0]?{...cand[0]}:null;
  if(!g||!g.so){ const S=Object.values(DB.courses).sort((x,y)=>(y.khaiGiang||'').localeCompare(x.khaiGiang||''));

async function bcdnBuild(D){

  if(miss.length) throw new Error('mẫu có mã lạ: '+miss.join(', '));
  zPut(z,'word/document.xml',y);
  const now=new Date(); z.FileIndex.forEach(e=>{ e.mt=now; e.ct=now; });

/* đọc lại file vừa tạo: từng đoạn chữ phải đúng bằng mẫu sau khi thay mã */
function bcdnVerify(buf,D){
  const P=[]; let x; try{ x=zGet(zOpen(buf),'word/document.xml'); }catch(e){ return ['Không đọc lại được file Word vừa tạo: '+e.message]; }
  if(!x) return ['File Word vừa tạo thiếu nội dung'];
  const want=wTexts(zGet(zOpen(tplBytes('bcdnTpl').buffer),'word/document.xml')).map(t=>t.replace(/\{\{(\w+)\}\}/g,(m,k)=>xmlEsc(D[k])));
  const got=wTexts(x);
  if(got.length!==want.length) P.push(`Số đoạn chữ khác mẫu (${got.length}/${want.length})`);
  want.forEach((t,i)=>{ if(got[i]!==t) P.push(`Đoạn ${i+1}: file ghi “${got[i]}”, đúng phải là “${t}”`); });
  if(/\{\{\w+\}\}/.test(x)) P.push('Còn sót mã chưa thay trong file');

/* ===== BC đăng ký khóa đào tạo (Word, xuất cùng Báo cáo 1) — độc lập, không đụng các file BC1/BC2 ===== */
const PA_NGAY_MD='16/07/2026';
function wordBuildT(tplId,D){
  const z=zOpen(tplBytes(tplId).buffer); const x=zGet(z,'word/document.xml'); if(!x) throw new Error('mẫu Word hỏng (thiếu word/document.xml)');
  const miss=[]; const y=x.replace(/\{\{(\w+)\}\}/g,(m,k)=>{ if(!(k in D)){ miss.push(k); return m; } return xmlEsc(D[k]); });
  if(miss.length) throw new Error('mẫu có mã lạ: '+miss.join(', '));
  zPut(z,'word/document.xml',y);
  const now=new Date(); z.FileIndex.forEach(e=>{ e.mt=now; e.ct=now; });
  const o=XLSX.CFB.write(z,{fileType:'zip',type:'array',compression:true}); return o instanceof Uint8Array?o:new Uint8Array(o);
}
function wordVerifyT(tplId,buf,D){
  const P=[]; let x; try{ x=zGet(zOpen(buf),'word/document.xml'); }catch(e){ return ['Không đọc lại được file Word vừa tạo: '+e.message]; }
  if(!x) return ['File Word vừa tạo thiếu nội dung'];
  const want=wTexts(zGet(zOpen(tplBytes(tplId).buffer),'word/document.xml')).map(t=>t.replace(/\{\{(\w+)\}\}/g,(m,k)=>xmlEsc(D[k])));
  const got=wTexts(x);
  if(got.length!==want.length) P.push(`Số đoạn chữ khác mẫu (${got.length}/${want.length})`);
  want.forEach((t,i)=>{ if(got[i]!==t) P.push(`Đoạn ${i+1}: file ghi “${got[i]}”, đúng phải là “${t}”`); });
  if(/\{\{\w+\}\}/.test(x)) P.push('Còn sót mã chưa thay trong file');
  return P;
}
function paNgayOk(t){ const m=String(t||'').trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if(!m) return false; const d=new Date(+m[3],+m[2]-1,+m[1]); return d.getDate()===+m[1]&&d.getMonth()===+m[2]-1; }
function bcdtData(c,pa){

function bcdtProblems(c,pa){

  if(!c.khaiGiang) E.push('Chưa nhập Ngày khai giảng (mục Thông tin khóa).');
  if(!c.beGiang) E.push('Chưa nhập Ngày bế giảng (mục Thông tin khóa).');
  if(c.khaiGiang&&c.beGiang&&c.beGiang<c.khaiGiang) E.push('Ngày bế giảng trước ngày khai giảng — kiểm tra lại Thông tin khóa.');

/* ===== KẾ HOẠCH ĐÀO TẠO (Word, mục Báo cáo 1) — giữ nguyên định dạng file mẫu; phân phối giờ học và lịch toàn khóa dựng theo khóa ===== */
const KHDT_PP_MD=[{ten:'Pháp luật về giao thông đường bộ',lt:'07',th:'',hinh:'',kt:'',gc:''},{ten:'Kỹ thuật lái xe',lt:'02',th:'',hinh:'',kt:'',gc:''},{ten:'Thực hành lái xe trên mô tô tập lái',lt:'',th:'',hinh:'03',kt:'',gc:''}];
function khdtCfg(){ const K=DB.khdt=DB.khdt||{}; if(!Array.isArray(K.pp)) K.pp=JSON.parse(JSON.stringify(KHDT_PP_MD)); if(!Array.isArray(K.gv)) K.gv=['3','','25']; if(!Array.isArray(K.xe)) K.xe=['16','','58']; if(!(K.ltNgay>=1)) K.ltNgay=1; return K; }

function khdtPlan(c){

    if(a<kg||b>bg) E.push(`${k} (${dnVN(a)} – ${dnVN(b)}) nằm ngoài thời gian khóa (${dnVN(kg)} – ${dnVN(bg)}).`); }

function khdtData(c,P){ return {KHOA:String(c.soKhoa||'').trim(),MA:String(c.maKhoa||'').trim(),HANG:P.hang,SONGAY:String(P.soNgay),TU:dnVN(P.kg),DEN:dnVN(P.bg),

function khdtBuild(c,P){
  const z=zOpen(tplBytes('khdtTpl').buffer); let x=zGet(z,'word/document.xml'); if(!x) throw new Error('mẫu Word hỏng');

  if(miss.length) throw new Error('mẫu có mã lạ: '+miss.join(', '));
  zPut(z,'word/document.xml',x);
  const now=new Date(); z.FileIndex.forEach(e=>{ e.mt=now; e.ct=now; });
  const o=XLSX.CFB.write(z,{fileType:'zip',type:'array',compression:true}); return o instanceof Uint8Array?o:new Uint8Array(o);
}
/* đọc lại file vừa tạo bằng trình phân tích XML: kiểm tra từng ô bảng, từng tuần, vị trí 2 ô hình Lý thuyết / Thực hành */
function khdtVerify(buf,c,P){
  const Pr=[]; let x; try{ x=zGet(zOpen(buf),'word/document.xml'); }catch(e){ return ['Không đọc lại được file Word vừa tạo: '+e.message]; }
  if(/\{\{\w+\}\}/.test(x)) Pr.push('Còn sót mã chưa thay trong file');
  const doc=new DOMParser().parseFromString(x,'application/xml'); if(doc.getElementsByTagName('parsererror').length) return ['File Word vừa tạo bị lỗi cấu trúc XML'];
  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main', WP='http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing';
  const kids=(el,n)=>[...el.childNodes].filter(e=>e.localName===n&&e.namespaceURI===W);
  const txt=el=>[...el.getElementsByTagNameNS(W,'t')].map(t=>t.textContent).join('');
  const body=doc.getElementsByTagNameNS(W,'body')[0], tbls=kids(body,'tbl');
  const D=khdtData(c,P), all=[...body.getElementsByTagNameNS(W,'p')].map(txt).join('\n');
  for(const s of [`Khóa: ${D.KHOA}`,`Mã Khóa: ${D.MA}`,`Hạng: ${D.HANG}`,`Thời gian đào tạo: ${D.SONGAY} ngày (Từ ngày: ${D.TU} đến ngày ${D.DEN})`,`hiện có: ${D.GV1}/${D.GV2}/${D.GV3}`,`hiện có: ${D.XE1}/${D.XE2}/${D.XE3}`])
    if(!all.replace(/[  ]+/g,' ').includes(s.replace(/ +/g,' '))) Pr.push(`Không thấy “${s}” trong file`);
  if(tbls.length<3) return [...Pr,'File thiếu bảng'];
  const rows=t=>kids(t,'tr').map(r=>kids(r,'tc'));
  const pp=rows(tbls[1]).slice(2);
  if(pp.length!==P.pp.length) Pr.push(`Bảng phân phối có ${pp.length} môn, đúng phải là ${P.pp.length}`);
  P.pp.forEach((r,i)=>{ const cs=pp[i]||[]; ['STT','TEN','TONG','LT','TH','HINH','KT','GC'].forEach((k,j)=>{ const g=cs[j]?txt(cs[j]):'(thiếu ô)'; if(g!==r[k]) Pr.push(`Phân phối giờ, môn ${i+1}, cột ${k}: file ghi “${g}”, đúng phải là “${r[k]}”`); }); });
  const lr=rows(tbls[2]), n=P.weeks.length;
  const gridW=[...kids(tbls[2],'tblGrid')[0].childNodes].filter(e=>e.localName==='gridCol').map(e=>+e.getAttributeNS(W,'w'));
  if(gridW.length!==2+n) Pr.push(`Bảng lịch có ${gridW.length-2} cột tuần, đúng phải là ${n}`);
  if(gridW.reduce((a,b)=>a+b,0)!==khdtParts().tblW) Pr.push('Tổng độ rộng bảng lịch khác bản mẫu');
  const span=tc=>{ const g=tc.getElementsByTagNameNS(W,'gridSpan')[0]; return g?+g.getAttributeNS(W,'val'):1; };
  const m0=lr[0].slice(2); if(m0.length!==P.months.length) Pr.push('Số nhóm tháng sai');
  P.months.forEach((g,i)=>{ if(!m0[i]||txt(m0[i])!==g.month||span(m0[i])!==g.span) Pr.push(`Tháng ${g.month}: sai nhãn hoặc số tuần gộp`); });
  P.weeks.forEach((wk,i)=>{ const a=lr[1][2+i], b=lr[2][2+i];
    if(!a||txt(a)!==String(wk.w)) Pr.push(`Cột tuần ${i+1}: file ghi tuần “${a?txt(a):''}”, đúng phải là ${wk.w}`);
    const want=pad(dnDate(wk.mon).getUTCDate(),2)+pad(dnDate(wk.mon+6).getUTCDate(),2); if(!b||txt(b)!==want) Pr.push(`Tuần ${wk.w}: ngày ghi “${b?txt(b):''}”, đúng phải là ${want}`); });
  for(const [ri,m,lab] of [[3,P.mLT,'Lý thuyết'],[4,P.mTH,'Thực hành']]){
    const found=[]; lr[ri].slice(1).forEach((tc,i)=>{ for(const a of tc.getElementsByTagNameNS(WP,'anchor')){ const off=+a.getElementsByTagNameNS(WP,'posOffset')[0].textContent, cx=+a.getElementsByTagNameNS(WP,'extent')[0].getAttribute('cx'); found.push({wi:i,off,cx}); } });
    const want=ri===3?1:3;
    if(found.length!==want) Pr.push(`Dòng ${lab}: có ${found.length} khung, đúng phải là ${want}`);
    else if(found.some(f=>f.wi!==m.wi)||found[0].off!==m.off||found.reduce((s,f)=>s+f.cx,0)!==m.cx||found.some((f,i)=>i&&f.off!==found[i-1].off+found[i-1].cx)) Pr.push(`Ô hình ${lab} sai vị trí trong file`);
  }
  const imgs=doc.getElementsByTagNameNS(WP,'anchor').length; if(imgs!==khdtParts().anchors+2) Pr.push(`Số hình trong file ${imgs}, đúng phải là ${khdtParts().anchors+2}`);
  return Pr;
}

function examStats(ex){
  const st={a1:ex.rows.filter(r=>/^a1/i.test(String(r.hang).trim())).length, tong:ex.rows.length, moi:0, moiLT:0, moiH:0, L:0, H:0, LH:0, unk:0, noTool:0, satHachH:0};
  for(const r of ex.rows){
    const k=ndClass(r.nd), g=gplxHang(r);
    if(!findPerson(r.id)) st.noTool++;
    if(k==='moi'){ st.moi++; if(g) st.moiH++; else st.moiLT++; }
    else if(k==='moiH'){ st.moi++; st.moiH++; st.satHachH++; }
    else if(k==='?') st.unk++; else st[k]++;
  }
  st.cLT=st.moiLT+st.L; st.cH=st.moiH+st.H; st.cLH=st.LH;
  return st;
}
function examCheck(ex){
  const E=[], W=[], I=[];
  const n=ex.rows.length;
  if(ex.tongSo!=null && ex.tongSo!==n) E.push(`File ghi “Tổng số: ${ex.tongSo}” nhưng đọc được ${n} dòng thí sinh.`);
  if(ex.tongSo==null) W.push('Không tìm thấy dòng “Tổng số” trên đầu file để đối chiếu số lượng.');
  for(const x of (ex.skipped||[])) E.push(`Dòng ${x.row} trong file gốc: ${x.ten||'(không tên)'} ${x.id||''} — ${x.reason}.`);
  const dup=(key,lab)=>{ const m={}; ex.rows.forEach(r=>{ const k=String(r[key]).trim(); (m[k]=m[k]||[]).push(r); });
    for(const k in m) if(k&&m[k].length>1) E.push(`${lab} ${k} bị trùng ở ${m[k].length} dòng: ${m[k].map(r=>r.ten).join(', ')}.`); };
  dup('sbd','SBD'); dup('cmt','Số CMT');
  const nums=ex.rows.map(r=>/^\d+$/.test(String(r.sbd))?+r.sbd:null);
  if(nums.every(x=>x!=null)){
    for(let i=1;i<nums.length;i++) if(nums[i]!==nums[i-1]+1){ W.push(`SBD không liên tục: sau ${nums[i-1]} là ${nums[i]} (dòng ${ex.rows[i].row}).`); }
  } else W.push('Có SBD không phải số — kiểm tra lại cột SBD.');
  ex.rows.forEach(r=>{
    if(!/^\d{9}$|^\d{12}$/.test(r.cmt)) W.push(`SBD ${r.sbd} ${r.ten}: số CMT “${r.cmt}” không phải 9 hoặc 12 chữ số.`);
    if(!parseVN(r.ns)) W.push(`SBD ${r.sbd} ${r.ten}: ngày sinh “${r.ns}” không đúng dạng dd/mm/yyyy.`);
    { const m=cccdVsDob(r.cmt,r.ns); if(m) W.push(`SBD ${r.sbd} ${r.ten}: số CMT không khớp ngày sinh — ${m}.`); }
    const kk=ndClass(r.nd), gg=gplxHang(r);
    if(kk==='moi'&&gg) W.push(`SBD ${r.sbd} ${r.ten}: file ghi “${r.nd}” nhưng hồ sơ có GPLX hạng ${gg} — theo quy tắc tính vào cột Hình. Kiểm tra lại có phải “Sát hạch H” không.`);
    if(kk==='moiH'&&!gg&&findPerson(r.id)) W.push(`SBD ${r.sbd} ${r.ten}: file ghi “${r.nd}” (đã có GPLX) nhưng hồ sơ trong tool chưa có hạng GPLX.`);
    if(kk==='?') E.push(`SBD ${r.sbd} ${r.ten}: nội dung sát hạch “${r.nd}” không nhận ra — không tính được bảng tổng hợp.`);
    if(/\s{2,}/.test(r.ten)) I.push(`SBD ${r.sbd}: họ tên có 2 khoảng trắng liền nhau “${r.ten}” — giữ nguyên như file gốc.`);
    (r.flags||[]).forEach(f=>W.push(`SBD ${r.sbd} ${r.ten}: ${f}.`));
    const f=findPerson(r.id);
    if(f){ if(norm(f.s.ten)!==norm(r.ten)) W.push(`SBD ${r.sbd}: cùng số CMT ${r.cmt} nhưng tên khác — phòng thi “${r.ten}”, hồ sơ khóa ${f.c.ten} “${f.s.ten}”.`);
           else if(f.s.ns&&r.ns&&f.s.ns!==r.ns) W.push(`SBD ${r.sbd} ${r.ten}: ngày sinh khác — phòng thi ${r.ns}, hồ sơ ${f.s.ns}.`); }
  });
  return {E,W,I};
}
/* Sắp khóa thi: ngày thi mới nhất trước, cùng ngày thì số khóa lớn trước */
function examKey(e){ const m=String(e.ngayThi||'').match(/(\d{2})\/(\d{2})\/(\d{4})/); const k=parseInt((String(e.khoaThi).match(/K(\d+)/i)||[])[1]||0,10);
  return (m?m[3]+m[2]+m[1]:'00000000')+String(k).padStart(6,'0'); }

/* ===== ĐỐI CHIẾU CHÉO: danh sách thi (file GLĐ) ↔ Báo cáo 2 của từng khóa đào tạo =====
   Chỉ so, không sửa gì. Khóa “chính” (≥ một nửa người dự thi của khóa có trong file) thì so cả 2 chiều. */
const GC2ND={L:'L',H:'H','L+H':'LH'};
function crossCheck(ex){
  const byC={}, E=[], W=[];
  for(const r of ex.rows){ const f=findPerson(r.id); if(!f) continue; (byC[f.c.id]=byC[f.c.id]||{c:f.c,hit:[]}).hit.push([f.s,r]); }
  const out=[];
  for(const {c,hit} of Object.values(byC)){
    const active=c.students.filter(s=>!s.biLoai), main=hit.length>=Math.max(1,active.length*0.5);
    const R={c,main,n:hit.length,active:active.length,missing:[],loai:[],nd:[],ok:0};
    for(const [s,r] of hit){
      const k=ndClass(r.nd);
      if(s.biLoai){ R.loai.push(`${s.ten} (SBD ${r.sbd}) đã bị LOẠI trong khóa ${c.ten}${s.lyDo?' — '+s.lyDo:''} nhưng vẫn có trong danh sách thi`); continue; }
      let want, got=k;
      if(s.loai==='moi'){ want='lần đầu'; if(k!=='moi'&&k!=='moiH') R.nd.push(`${s.ten} (SBD ${r.sbd}): BC2 là học mới (SH lần đầu), danh sách thi ghi “${r.nd}”`); else R.ok++; }
      else { if(!s.gcTL){ R.nd.push(`${s.ten} (SBD ${r.sbd}): BC2 chưa chọn nội dung SH lại, danh sách thi ghi “${r.nd}”`); continue; }
        if(GC2ND[s.gcTL]!==k) R.nd.push(`${s.ten} (SBD ${r.sbd}): BC2 ghi “${GC_LABEL[s.gcTL]}”, danh sách thi ghi “${r.nd}”`); else R.ok++; }
    }
    if(main){ const ids=new Set(ex.rows.map(r=>r.id));
      for(const s of active) if(!ids.has(s.cccd)){
        const other=(DB.exams||[]).find(e=>e!==ex&&e.rows.some(r=>r.id===s.cccd));
        R.missing.push(`${s.ten} (${s.cccd}, ${s.loai==='moi'?'học mới':'thi lại '+(GC_LABEL[s.gcTL]||'')})${other?` — có ở khóa thi ${other.khoaThi}`:''}`); } }
    out.push(R);
  }
  return out.sort((a,b)=>b.n-a.n);
}
function crossHtml(ex){

/* File thi lại đã lọc (<khóa>_LOCTL): quét và TỰ ĐIỀN nội dung SH lại theo số định danh.
   gcfill = chỉ điền nội dung, giữ nguyên danh sách thi lại

let lastLoc=null;
function applyLocTL(p, conf){
  p.target='gcfill';   // file lọc CHỈ dùng để điền nội dung theo số CCCD — không thêm, không bớt danh sách
  const c=C(), R={file:p.file, mode:p.target, fill:0, changed:[], added:[], missing:[], isMoi:[], out:0, nameDiff:[]};
  const ids=new Set(p.recs.map(r=>r.id));
  for(const r of p.recs){
    let s=c.students.find(x=>x.cccd===r.id);
    if(s&&s.loai==='moi'){ R.isMoi.push(r); continue; }
    if(!s){
      if(true){ R.missing.push(r); continue; }
      s={cccd:r.id, loai:'tl', ord:c.seq++, srcs:[], biLoai:false, lyDo:'', gcTL:'', phuTrach:'', sbd:'',
         ten:upper(r.ten), ns:r.ns, dc:r.dc, sk:r.sk||'x', hangHS:r.hang, soGPLX:'', maDK:'', soHS:''};
      c.students.push(s); R.added.push(r);
    }
    if(r.ten&&norm(s.ten)!==norm(r.ten)) R.nameDiff.push(`${r.id}: file ghi “${upper(r.ten)}”, danh sách thi lại ghi “${s.ten}”`);
    if(s.gcTL&&s.gcTL!==r.gcTL) R.changed.push(`${s.ten}: ${GC_LABEL[s.gcTL]} → ${GC_LABEL[r.gcTL]}`);
    s.gcTL=r.gcTL; s.gcSrc='file'; s.gcFile=p.file; R.fill++;
    if(s.biLoai&&s.lyDo==='Không có trong file thi lại đã lọc'){ s.biLoai=false; s.lyDo=''; }
    if(!s.srcs.includes('loctl')) s.srcs.push('loctl');
  }
  if(p.target==='tlr') for(const s of c.students){ if(s.loai==='tl'&&!ids.has(s.cccd)&&!s.biLoai){ s.biLoai=true; s.lyDo='Không có trong file thi lại đã lọc'; R.out++; } }
  // tự kiểm lại: mọi người trong file đã khớp phải mang đúng nội dung của file
  R.verifyFail=p.recs.filter(r=>{ const s=c.students.find(x=>x.cccd===r.id); return s&&s.loai==='tl'&&s.gcTL!==r.gcTL; }).length;
  R.nameDiff.forEach(x=>conf.push(`File lọc “${p.file}”: cùng số CCCD nhưng khác tên — ${x}. Đã điền theo số CCCD, kiểm tra lại.`));
  R.missing.forEach(r=>conf.push(`File lọc “${p.file}”: ${upper(r.ten)} (${r.id}) chưa có trong danh sách thi lại — chưa điền. Nạp file ${C().ten}_TL (danh sách thi lại đầy đủ) trước rồi nạp lại file lọc.`));
  R.isMoi.forEach(r=>conf.push(`File lọc “${p.file}”: ${upper(r.ten)} (${r.id}) đang thuộc danh sách HỌC MỚI — không điền nội dung thi lại.`));
  R.added.forEach(r=>conf.push(`File lọc “${p.file}”: đã thêm ${upper(r.ten)} (${r.id}) vào danh sách thi lại${r.dc?'':' — file không có nơi cư trú, cần bổ sung'}.`));
  if(R.out) conf.push(`File lọc “${p.file}”: ${R.out} người thi lại cũ không có trong file → đã chuyển sang LOẠI (bỏ loại được nếu nhầm).`);
  c.locLast={file:p.file, t:new Date().toISOString(), n:R.fill};
  lastLoc=R;
}

   ${R.missing.length?`<li style="color:var(--amber)">Có trong file nhưng chưa có trong danh sách thi lại: ${R.missing.length} người — chưa điền (nạp file ${esc(C().ten)}_TL trước)</li>`:''}

function applySBDServer(p, conf){
  DB.exams=DB.exams||[];
  const ex={id:'e'+Date.now()+Math.random().toString(36).slice(2,6), khoaThi:p.khoaThi, ngayThi:p.ngayThi, file:p.file, t:new Date().toISOString(),
    tongSo:p.tongSo, skipped:p.skipped||[],
    rows:p.recs.map(r=>({sbd:r.sbd, ten:r.ten, cmt:r.cmt, id:r.id, ns:r.ns, hang:r.hang, nd:r.nd, flags:r.flags||[], row:r.row}))};
  const same=e=>norm(asciiName(e.khoaThi))===norm(asciiName(ex.khoaThi));
  if(DB.exams.some(same)){
    if(!p.replace){ conf.push(`Khóa thi ${ex.khoaThi} đã có file — không nạp “${p.file}”.`); return; }
    // gỡ SBD đã gán từ file cũ của khóa thi này, rồi bỏ hẳn danh sách cũ
    for(const c of Object.values(DB.courses)) if(c.sbd&&c.sbd.server&&norm(asciiName(c.sbd.server.khoaThi))===norm(asciiName(ex.khoaThi))){
      c.students.forEach(s=>{ if(s.sbdSrc==='server'){ s.sbd=''; s.sbdN=0; s.sbdSrc=''; } }); c.sbd.server=null; c.sbd.locked=false; }
    DB.exams=DB.exams.filter(e=>!same(e));
    conf.push(`Khóa thi ${ex.khoaThi}: đã THAY danh sách cũ bằng file “${p.file}”.`);
  }
  DB.exams.unshift(ex);
  DB.curExam=ex.id;
  // gán SBD cho học viên các khóa đào tạo có trong file
  const per={}; let nf=0;
  for(const r of ex.rows){ const f=findPerson(r.id); if(!f){ nf++; continue; }
    (per[f.c.id]=per[f.c.id]||{c:f.c,n:0,hits:[]}).hits.push([f.s,r]); per[f.c.id].n++; }
  const iso=ex.ngayThi? ex.ngayThi.split('/').reverse().join('-') : '';
  // Chỉ coi là kỳ thi của khóa khi khớp từ một nửa số người dự thi của khóa trở lên
  for(const x of Object.values(per)){
    const active=x.c.students.filter(s=>!s.biLoai).length;
    x.main = x.n >= Math.max(1, active*0.5);
    if(!x.main) continue;
    for(const [s,r] of x.hits){ s.sbd=r.sbd; s.sbdN=parseInt(String(r.sbd).replace(/\D/g,''),10)||0; s.sbdSrc='server'; }
    x.c.sbd.locked=true; x.c.sbd.server={t:ex.t, file:ex.file, n:x.n, miss:[], noSbd:0, khoaThi:ex.khoaThi};
    if(iso&&!x.c.ngaySH) x.c.ngaySH=iso;
  }
  conf.push(`Khóa thi ${ex.khoaThi} (${ex.ngayThi}): ${ex.rows.length} thí sinh`+
    (Object.keys(per).length?`, có ${Object.values(per).map(x=>x.n+' người của khóa '+x.c.ten+(x.main?' (đã gán SBD)':'')).join(', ')}`:'')+
    (nf?`, ${nf} người không có trong dữ liệu tool (cột Hạng GPLX đã có sẽ để trống)`:'')+'.');
}

/* ================== KIỂM TRA ================== */
/* Số CCCD 12 số: 3 số đầu = mã tỉnh nơi khai sinh (001–096), số thứ 4 = giới tính + thế kỷ sinh
   (0/1: 1900–1999, 2/3: 2000–2099, 4/5: 2100…, 8/9: 1800…), số 5–6 = 2 số cuối năm sinh.
   Trả về chuỗi mô tả chỗ không khớp với ngày sinh, hoặc '' nếu khớp / không kiểm được. */
function cccdVsDob(id,ns){
  id=String(id||''); if(!/^\d{12}$/.test(id)) return '';
  const tinh=+id.slice(0,3), g=+id[3], yy=id.slice(4,6), d=parseVN(ns);
  const P=[];
  if(tinh<1||tinh>96) P.push(`mã tỉnh “${id.slice(0,3)}” không có (phải từ 001 đến 096)`);
  if(d){ const y=d.getFullYear(), the=[1900,1900,2000,2000,2100,2100,2200,2200,1800,1800][g];
    const yCc=the+ +yy;
    if(yCc!==y) P.push(`CCCD cho năm sinh ${yCc} (số thứ 4 là “${g}”, số 5–6 là “${yy}”), ngày sinh ghi năm ${y}`); }
  return P.join('; ');
}
function checks(){
  const c=C(), out=[]; const add=(lv,s,msg)=>out.push({lv,s,msg});
  const at = c.ngaySH? new Date(c.ngaySH) : (c.beGiang? new Date(c.beGiang): null);
  const ids=new Set(c.students.map(s=>s.cccd));
  for(const s of c.students){
    const nh=normHang(s.hangHS), ng=normHang(s.hangG);
    if(s.hangHS&&s.hangG&&nh!==ng) add('warn',s,`Hạng GPLX lệch: hồ sơ ghi “${s.hangHS}”, file GPLX ghi “${s.hangG}”. Báo cáo đang lấy theo hồ sơ.`);
    if(!s.hangHS&&s.hangG) add('info',s,`Hồ sơ không ghi hạng, file GPLX có hạng “${s.hangG}” — báo cáo sẽ dùng hạng này.`);
    if(s.loai==='moi'&&s.hangHS&&!s.soGPLX) add('warn',s,`Có hạng “${s.hangHS}” nhưng thiếu số GPLX (cột 6 BC1 sẽ trống).`);
    if(!s.srcs.includes('hoso')) add('info',s,`Không có trong file hồ sơ (nguồn: ${s.srcs.join(', ')||'nhập tay'}).${s.biLoai?' Đang bị loại.':''}`);
    if(s.cccd.length===9) add('info',s,'Số định danh 9 số (CMND cũ).');
    else if(s.cccd.length!==12) add('err',s,`Số định danh ${s.cccd.length} số — sai định dạng.`);
    else { const m=cccdVsDob(s.cccd,s.ns); if(m) add('err',s,`Số CCCD không khớp ngày sinh: ${m}. Kiểm tra lại số CCCD hoặc ngày sinh.`); }
    const a=ageAt(s.ns,at); if(a!=null&&a<18&&!s.biLoai) add('err',s,`Chưa đủ 18 tuổi tại ngày ${c.ngaySH?'sát hạch':'bế giảng'} (${a} tuổi).`);
    if(!parseVN(s.ns)) add('warn',s,`Ngày sinh không đúng dạng dd/mm/yyyy: “${s.ns}”.`);
    if(!s.biLoai&&s.sk.toLowerCase()!=='x') add('warn',s,'Chưa có dấu “x” giấy CNSK hợp lệ.');
    if(s.loai==='tl'&&!s.biLoai&&!s.gcTL) add('warn',s,'Thi lại nhưng chưa chọn nội dung L / H / L+H.');
    if(c.sbd.locked&&!s.biLoai&&!s.sbd) add('warn',s,'Không có trong danh sách phòng thi đã nạp (chưa có SBD).');
    if(!s.ten) add('err',s,'Thiếu họ tên.');
    if(!s.biLoai&&!String(s.dc||'').trim()) add('warn',s,'Thiếu nơi cư trú (cột Nơi cư trú trên báo cáo sẽ trống).');
  }
  for(const id in c.gplx){ if(!ids.has(id)) out.push({lv:'info',s:{ten:upper(c.gplx[id].ten),cccd:id,loai:''},msg:'Có trong file GPLX nhưng không có trong danh sách khóa này.'}); }
  for(const m of (c.conflicts||[])) out.push({lv:'warn',s:null,msg:m});
  const order={err:0,warn:1,info:2}; out.sort((a,b)=>order[a.lv]-order[b.lv]);
  return out;
}

function relTxt(m){
  const lb=BASE_LB[m.base]||m.base, f=m.from, t=m.to;
  const one=d=> d>0?`${d} ngày trước ${lb}`: d===0?`ngày ${lb}`:`${-d} ngày sau ${lb}`;
  if(f===t) return f===0?`Đúng ngày ${lb}`: f>0?`Trước ${lb} ${f} ngày`:`Sau ${lb} ${-f} ngày`;
  if(f>0&&t>0) return `Trước ${lb} ${f}–${t} ngày`;
  return `Từ ${one(f)} đến ${one(t)}`;
}

function migrateMoc(){
  if((DB.mocVer||1)>=MOC_VER && DB.mocTpl) return;
  const old=DB.mocTpl||[]; const fresh=JSON.parse(JSON.stringify(MOC_DEFAULT));
  const alias={'bo sung file thi lai (da loc) + noi dung l/h/l+h':'bo sung file thi lai + noi dung sh lai (file _loctl)'};
  for(const c of Object.values(DB.courses)){
    const done=c.mocDone||{}, nd={};
    old.forEach(m=>m.steps.forEach((st,i)=>{ const v=done[m.key+'_'+i]; if(!v) return;
      let n=norm(st); n=alias[n]||n;
      fresh.forEach(fm=>fm.steps.forEach((fs,j)=>{ if(norm(fs)===n) nd[fm.key+'_'+j]=v; })); }));
    c.mocDone=nd;
  }

const DAY=864e5;
function isoDate(iso){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function today0(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function fmtD(d){ return pad(d.getDate(),2)+'/'+pad(d.getMonth()+1,2)+'/'+d.getFullYear(); }
const THU=['CN','T2','T3','T4','T5','T6','T7'];
function mocList(c, withNoDate){
  c.mocDone=c.mocDone||{};
  const t=today0();
  return DB.mocTpl.map(m=>{
    const kg=isoDate(baseIso(c,m.base||'kg'));
    if(!kg) return withNoDate? {...m, st:'nodate', done:m.steps.map((_,i)=>!!c.mocDone[m.key+'_'+i])} : null;
    const from=new Date(kg.getTime()-m.from*DAY), to=new Date(kg.getTime()-m.to*DAY);
    const done=m.steps.map((_,i)=>!!c.mocDone[m.key+'_'+i]);
    const all=done.every(Boolean);
    let st, n;
    if(all) st='done';
    else if(t<from){ st='wait'; n=Math.round((from-t)/DAY); }
    else if(t<=to){ st='act'; n=Math.round((to-t)/DAY); }
    else { st='over'; n=Math.round((t-to)/DAY); }
    return {...m, fromD:from, toD:to, done, st, n, left:done.filter(x=>!x).length};
  }).filter(Boolean).sort((a,b)=>(a.fromD||8e15)-(b.fromD||8e15));
}
function whenTxt(m){ return m.from===m.to ? `${THU[m.fromD.getDay()]} ${fmtD(m.fromD)}` : `${THU[m.fromD.getDay()]} ${fmtD(m.fromD)} → ${THU[m.toD.getDay()]} ${fmtD(m.toD)}`; }
function stTxt(m){ return m.st==='done'?'Đã xong': m.st==='act'?(m.n===0?'Hạn chót hôm nay':`Đến hạn, còn ${m.n} ngày`): m.st==='over'?`Quá hạn ${m.n} ngày`:`Còn ${m.n} ngày nữa`; }

function reminderItems(){
  const t=today0(), out=[];

function stepsHtml(c,m){
  const hint=(s)=>{ const T=t=>new Date(t).toLocaleString('vi-VN');

    if(/sbd|số báo danh/i.test(s)&&/xuất/i.test(s)&&c.lastSBD) return `đã xuất lúc ${T(c.lastSBD)}`;
    if(/máy chủ/i.test(s)&&c.sbd&&c.sbd.server) return `đã nạp ${c.sbd.server.n} SBD lúc ${T(c.sbd.server.t)}`;
    return ''; };
  return m.steps.map((s,i)=>{ const k=m.key+'_'+i, h=hint(s);
    return `<label class="step ${m.done[i]?'ok':''}"><input type="checkbox" data-mk="${k}" ${m.done[i]?'checked':''}><span>${esc(s)}</span>
      ${c.mocDone[k]&&c.mocDone[k]!==true?`<small>— ${new Date(c.mocDone[k]).toLocaleString('vi-VN')}</small>`:''}${h&&!m.done[i]?`<small>(${h})</small>`:''}</label>`; }).join('');
}

      if(seen[k]){ p.target='skip'; p.userLock=true; p.nameOk=false; p.nameMsg=`Trùng khóa thi ${p.khoaThi} với file “${seen[k]}” trong lần nạp này — mỗi khóa thi chỉ 1 file, file này không nạp.`; } else seen[k]=p.file; }); }

function xmlHint(p){
  const c=C(), ids=new Set(p.recs.map(r=>r.id));
  const n=k=>c.students.filter(s=>s.loai===k&&ids.has(s.cccd)).length;
  return {m:n('moi'), t:n('tl'), tlName:p.guess==='tl'};
}
/* bằng chứng ngược với lựa chọn → trả về câu cảnh báo */
function xmlDoubt(p,part){
  const h=xmlHint(p), W=[];
  if(part==='moi'&&h.t>h.m) W.push(`${h.t} người trong file trùng danh sách THI LẠI, chỉ ${h.m} người trùng thi mới`);
  if(part==='tl'&&h.m>h.t) W.push(`${h.m} người trong file trùng danh sách THI MỚI, chỉ ${h.t} người trùng thi lại`);
  if(part==='moi'&&h.tlName) W.push(`tên khóa trong XML là “${p.tenKH}” (có -TL)`);
  if(part==='tl'&&!h.tlName&&!h.t) W.push(`tên khóa trong XML là “${p.tenKH}” (không có -TL)`);
  return W;
}
function xmlPick(p,part,done){
  const lab=part==='tl'?'THI LẠI':'THI MỚI (lần đầu)', c=C();
  const other=pending.find(x=>x!==p&&x.kind==='xml'&&x.target!=='skip'&&x.part===part);

      [['Chọn lại','pri',()=>{ setTimeout(()=>askXmlPart(p,done),0); }]]); return; }
  const W=xmlDoubt(p,part), old=c.xml&&c.xml[part];
  const fin=()=>{ p.part=part; p.target='xml'; p.userSet=true; done&&done(); };

  dialog('Xác nhận gán mã XML',`<div>Gán mã <b>${esc(p.code)}</b> (file ${esc(p.file)}) cho <b>${lab}</b>?</div>

    ${old&&old.code!==p.code?`<div class="note" style="margin-top:10px">${ic('info')}<span>${lab} của khóa ${esc(c.ten)} đang dùng mã <b>${esc(old.code)}</b> (file ${esc(old.file)}) — sẽ được thay bằng mã ${esc(p.code)}.</span></div>`:''}`,
    [['Chọn lại','',()=>{ setTimeout(()=>askXmlPart(p,done),0); }],['Đúng, gán cho '+(part==='tl'?'thi lại':'thi mới'),'pri',()=>{ setTimeout(fin,0); }]]);

    ${c.xml&&(c.xml.moi||c.xml.tl)?`<div class="muted" style="font-size:12.5px;margin-top:8px">Khóa ${esc(c.ten)} đang dùng: thi mới ${c.xml.moi?'<b>'+esc(c.xml.moi.code)+'</b>':'(chưa có)'} · thi lại ${c.xml.tl?'<b>'+esc(c.xml.tl.code)+'</b>':'(chưa có)'}</div>`:''}`,
    [['Bỏ qua file này','',()=>{ p.target='skip'; p.userSet=true; done&&setTimeout(done,0); }],

function askXmlQueue(after){

function doPaste(){
  snapshot('Dán nhanh từ Excel');
  const c=C(), mode=$('#pasteMode').value; let ok=0, miss=[];
  for(const line of $('#pasteBox').value.split(/\r?\n/)){
    const p=line.split('\t').map(x=>x.trim()); if(!p[0]) continue;
    const id=normId(p[0]); const s=c.students.find(x=>x.cccd===id);
    if(!s){ miss.push(p[0]); continue; }
    if(mode==='gc'){ const v=parseGC(p[1]||''); if(v){s.gcTL=v;ok++;} else miss.push(p[0]+' (giá trị “'+(p[1]||'')+'”)'); }
    else if(mode==='loai'){ s.biLoai=true; s.lyDo=p[1]||'Khác'; ok++; }
    else if(mode==='pt'){ s.phuTrach=p[1]||''; ok++; }
    else if(mode==='gplx'){ s.soGPLX=p[1]||''; if(p[2]) s.hangHS=p[2]; ok++; }
  }
  save(); render(); toast(`Áp dụng ${ok} dòng.`+(miss.length?` Không khớp ${miss.length}: ${miss.slice(0,4).join(', ')}${miss.length>4?'…':''}`:''),5000);
}

function filterList(list,q,f){
  const n=norm(q);
  return list.filter(s=>{
    if(f==='loai'&&!s.biLoai) return false; if(f==='giu'&&s.biLoai) return false;
    if(f==='gplx'&&!(s.hangHS||s.soGPLX)) return false;
    if(f==='thieu'&&(s.gcTL||s.biLoai)) return false;
    if(!n) return true; return norm(s.ten).includes(n)||s.cccd.includes(n)||norm(s.dc).includes(n);
  });
}

function findAll(q){
  const nq=norm(q).trim(), dq=String(q).replace(/\D/g,'');
  if(nq.length<2&&dq.length<3) return [];
  const hit=s=> (dq.length>=3&&String(s.cccd||s.id||s.cmt||'').includes(dq)) || (nq.length>=2&&!/^\d+$/.test(nq)&&norm(s.ten).includes(nq));
  const R=[];
  for(const c of Object.values(DB.courses)) for(const s of c.students) if(hit(s)){
    const ex=(DB.exams||[]).filter(e=>e.rows.some(r=>r.id===s.cccd)).map(e=>{ const r=e.rows.find(r=>r.id===s.cccd); return `${e.khoaThi}: SBD ${r.sbd} — ${r.nd}`; });
    R.push({c,s,ex}); }
  const known=new Set(R.map(x=>x.s.cccd));
  for(const e of (DB.exams||[])) for(const r of e.rows) if(!known.has(r.id)&&hit({ten:r.ten,cccd:r.id})){ known.add(r.id); R.push({c:null,s:{ten:r.ten,cccd:r.cmt,ns:r.ns,id:r.id},ex:[`${e.khoaThi}: SBD ${r.sbd} — ${r.nd}`]}); }
  return R;
}

  dialog(`Tìm “${q}” trên mọi khóa`, R.length?`<div class="muted" style="margin-bottom:6px">${R.length>100?'Hiện 100/'+R.length:R.length} kết quả</div><div class="imp" style="max-height:60vh;overflow:auto;margin-top:0"><table><thead><tr><th>Khóa</th><th>Họ và tên</th><th>Ngày sinh</th><th>CCCD</th><th>Danh sách</th><th>Số báo danh</th><th></th></tr></thead><tbody>
    ${R.slice(0,100).map((x,i)=>`<tr><td><b>${x.c?esc(x.c.ten):'<span class="muted">—</span>'}</b></td><td>${esc(x.s.ten)}</td><td>${esc(x.s.ns||'')}</td><td>${esc(x.s.cccd)}</td>

function printHTML(title,body){
  const css=`@page{size:A4 landscape;margin:9mm 8mm}
   body{font-family:'Times New Roman',serif;font-size:11pt;color:#000;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
   .hd{display:flex;justify-content:space-between;text-align:center;font-weight:bold;font-size:12pt}.hd div{width:46%}
   .u{display:inline-block;border-bottom:1px solid #000;padding-bottom:1px}
   h1{font-size:15pt;text-align:center;margin:8px 0 2px}.c{text-align:center}.sub{text-align:center;margin:2px 0}
   .info{display:flex;justify-content:space-between;margin:4px 0 6px}.info div{white-space:pre}
   table{border-collapse:collapse;width:100%;margin-top:4px}th,td{border:1px solid #000;padding:2px 4px;vertical-align:middle}
   th{font-size:9.5pt;text-align:center}thead{display:table-header-group}tr{page-break-inside:avoid}
   td{font-size:10pt;padding:1px 3px}td.n,td.m{white-space:nowrap}th{white-space:normal}td.n,td.m{text-align:center}td.t{font-size:11pt}.y td{background:#ff0}.tot{font-weight:bold;margin-top:6px}
   .sign{display:flex;justify-content:flex-end;margin-top:10px}.sign div{width:45%;text-align:center}
   .pb{page-break-before:always}.sum td,.sum th{font-size:11pt;text-align:center}`;
  let f=$('#printFrame'); if(f) f.remove();
  f=document.createElement('iframe'); f.id='printFrame'; f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);
  const d=f.contentDocument; d.open(); d.write(`<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>${esc(title)}</title><style>${css}</style></head><body>${body}</body></html>`); d.close();
  setTimeout(()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ toast('Trình duyệt chặn in: '+e.message,5000); } },250);
  (DB.xlog=DB.xlog||[]).push({t:new Date().toISOString(), file:'IN: '+title, khoa:C().ten, ver:APP_VER, rule:sortRuleOf(), ok:false}); save();
}

async function exportTB(ex,V){

  wb.worksheets.slice().forEach(w=>{ if(w.name!=='Mẫu thông báo A1') wb.removeWorksheet(w.id); });
  const ws=wb.getWorksheet('Mẫu thông báo A1'); if(!ws) throw new Error('Không thấy sheet mẫu thông báo');
  const d=parseVN(V.ngay); if(!d){ toast('Ngày sát hạch chưa đúng dạng dd/mm/yyyy.',5000); return false; }

  set('C6',V.tapTrung); set('C7',V.khaiMac); set('C8',V.diemDanh); set('C9',V.diaDiem);

  F('A11','"📅  NGÀY SÁT HẠCH: "&TEXT(C5,"dd/mm/yyyy")','📅  NGÀY SÁT HẠCH: '+V.ngay);

  for(let r=4;r<=10;r++) ws.getRow(r).hidden=true;      // ẩn khung “thông tin chỉnh sửa” khi gửi cho học viên (vẫn sửa được trong Excel)
  ws.pageSetup.printArea='A$1:H$39'; ws.pageSetup.fitToPage=true; ws.pageSetup.fitToWidth=1; ws.pageSetup.fitToHeight=1;
  const name=`THONGBAO_${asciiName(ex?ex.khoaThi:'SATHACH')}.xlsx`;
  return download(wb,name, back=>{ const w=back.worksheets[0], P=[];
    const want={A11:'📅  NGÀY SÁT HẠCH: '+V.ngay, E11:'⏰  THỜI GIAN TẬP TRUNG: '+V.tapTrung, A20:V.khaiMac, A21:V.diemDanh, C6:V.tapTrung, C9:V.diaDiem};
    for(const a in want){ const v=w.getCell(a).value, got=v&&typeof v==='object'&&'result' in v?v.result:v; if(String(got)!==String(want[a])) P.push(`Ô ${a}: “${got}” — đúng phải là “${want[a]}”`); }
    if(back.worksheets.length!==1) P.push('File thông báo có nhiều hơn 1 sheet');
    return P; });
}
function copyText(t){
  const fb=()=>{ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} a.remove(); return ok; };
  if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(()=>true,()=>fb());
  return Promise.resolve(fb());
}

/* đọc lại file PDF: lấy từng đoạn chữ (vị trí, cỡ chữ, nội dung qua bảng ToUnicode) của mọi trang */
async function pdfReadBack(u8){
  const s=new TextDecoder('latin1').decode(u8), O={};
  const re=/(\d+) 0 obj\n/g; let m;
  while((m=re.exec(s))){ const n=+m[1], st=m.index+m[0].length; const e=s.indexOf('\nendobj',st); const body=s.slice(st,e);
    const si=body.indexOf('\nstream\n'); if(si<0){ O[n]={dict:body}; continue; }
    const dict=body.slice(0,si), len=+(dict.match(/\/Length (\d+)/)||[])[1]; const a=st+si+8; let data=u8.slice(a,a+len);
    if(/\/Filter \/FlateDecode/.test(dict)) data=await zInflate(data);

  const pagesN=+(O[root].dict.match(/\/Pages (\d+)/)||[])[1]; const kids=[...O[pagesN].dict.match(/\/Kids \[([^\]]*)\]/)[1].matchAll(/(\d+) 0 R/g)].map(x=>+x[1]);

  const uni=fn=>{ if(cmapCache[fn]) return cmapCache[fn]; const tu=+(O[fn].dict.match(/\/ToUnicode (\d+)/)||[])[1]; const M={};
    for(const x of dec.decode(O[tu].data).matchAll(/<([0-9a-f]{4})> <([0-9a-f]+)>/gi)){ let t=''; for(let i=0;i<x[2].length;i+=4) t+=String.fromCharCode(parseInt(x[2].slice(i,i+4),16)); M[x[1].toLowerCase()]=t; }
    return cmapCache[fn]=M; };
