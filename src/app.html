  const pages=kids.map(k=>{ const d=O[k].dict; const fonts={}; for(const x of (d.match(/\/Font << ([^>]*) >>/)||['',''])[1].matchAll(/\/(F\d+) (\d+) 0 R/g)) fonts[x[1]]=+x[2];
    const imgs=(d.match(/\/XObject << ([^>]*) >>/)||['',''])[1].match(/\/Im\d+/g)||[];
    const ct=+(d.match(/\/Contents (\d+)/)||[])[1]; const txt=dec.decode(O[ct].data), T=[];
    for(const x of txt.matchAll(/\/(F\d+) ([\d.]+) Tf 1 0 0 1 ([-\d.]+) ([-\d.]+) Tm <([0-9a-f]*)> Tj/gi)){ const M=uni(fonts[x[1]]); let t=''; for(let i=0;i<x[5].length;i+=4) t+=M[x[5].slice(i,i+4).toLowerCase()]??'�';
      T.push({font:x[1], bold:/Bold/.test(O[fonts[x[1]]].dict), size:+x[2], x:+x[3], y:H-(+x[4]), t}); }
    return {texts:T, imgs:imgs.map(n=>{ const r=+(d.match(new RegExp(n.replace('/','\\/')+' (\\d+) 0 R'))||[])[1]; const di=O[r].dict; return {w:+(di.match(/\/Width (\d+)/)||[])[1], h:+(di.match(/\/Height (\d+)/)||[])[1]}; })}; });
  return {pages,H};
}

async function sbdPdfVerify(buf,ex,cfg,st){
  const P=[]; let R; try{ R=await pdfReadBack(buf); }catch(e){ return ['Không đọc lại được file PDF vừa tạo: '+e.message]; }
  const plan=sbdPdfPlan(ex.rows.length), X=SBDPDF.X;
  if(R.pages.length!==plan.length) P.push(`Số trang ${R.pages.length}, đúng phải là ${plan.length}`);
  const col=x=>{ for(let i=0;i<6;i++) if(x>=X[i]-1&&x<X[i+1]) return i; return -1; };
  let k=0;
  R.pages.forEach((pg,pi)=>{
    const all=pg.texts.map(t=>t.t).join('|');
    for(const h of ['SBD','Họ và tên','Số CMT','Ngày tháng','Sinh','Hạng','Nội dung','sát hạch']) if(!pg.texts.some(t=>t.t===h)) P.push(`Trang ${pi+1}: thiếu tiêu đề cột “${h}”`);
    if(pi===0){ for(const w of [cfg.dv1,cfg.dv2,'Tại: '+cfg.tai,'Khóa thi: '+ex.khoaThi,'Ngày thi: '+(ex.ngayThi||''),'DANH SÁCH THÍ SINH DỰ THI SÁT HẠCH MÔ TÔ',String(st.a1)]) if(!pg.texts.some(t=>t.t===w)) P.push(`Trang 1: thiếu “${w}”`); }
    const y0=pi===0?181.4:55.5, rows={};
    for(const t of pg.texts){ if(t.y<y0) continue; const ri=Math.floor((t.y-y0)/SBDPDF.RH+1e-6); (rows[ri]=rows[ri]||[]).push(t); }
    const [a,b]=plan[pi]||[0,0];
    Object.keys(rows).map(Number).sort((x,y)=>x-y).forEach(ri=>{
      const cells=['','','','','',''], r=ex.rows[k];
      for(const t of rows[ri]){ const c=col(t.x+1); if(c>=0) cells[c]+=t.t; }
      if(!r){ P.push(`Trang ${pi+1}: dư dòng “${cells.join(' | ')}”`); k++; return; }
      const want=[String(r.sbd),r.ten,r.cmt,r.ns,r.hang,r.nd].map(v=>String(v??'').normalize('NFC'));
      want.forEach((w,c)=>{ if(cells[c]!==w) P.push(`SBD ${r.sbd}: cột ${['SBD','Họ và tên','Số CMT','Ngày sinh','Hạng','Nội dung'][c]} trong PDF ghi “${cells[c]}”, đúng phải là “${w}”`); });
      k++; });
    if(k!==b) P.push(`Trang ${pi+1}: hết trang ở người thứ ${k}, đúng phải là ${b}`);
  });
  if(k!==ex.rows.length) P.push(`PDF có ${k} người, danh sách có ${ex.rows.length} người`);
  return P;
}

    <ul style="margin:10px 0 0;padding-left:20px;line-height:1.8"><li>${plan.length} trang A4 đứng — trang 1: ${plan[0][1]} người, các trang sau tối đa ${SBDPDF.PN} người, tiêu đề cột lặp lại mỗi trang</li><li>Khi in: chọn khổ A4, tỉ lệ <b>Thực tế / 100%</b> (không “Vừa trang”)</li></ul>`,[['Đóng','pri']]);
  return true;
}

        <div style="max-height:300px;overflow:auto;margin-top:10px;font-size:13px">${probs.slice(0,80).map(x=>'• '+esc(x)).join('<br>')}</div>`,[['Đóng','pri']]);

}

  for(let r=R;r<=last;r++){ const row=ws.getRow(r); for(let k=1;k<=maxC;k++){ const c=row.getCell(k); c.value=null; c.style={}; } row.height=undefined; row.hidden=false; }
  const tplCols=tpl.c.map((t,k)=>k+1).filter(k=>tpl.c[k-1].v!=null||tpl.c[k-1].st.border);
  const nameCol=tpl.c.findIndex(t=>vText(t.v)==='{{HO_TEN}}')+1;
  // 3) mỗi người 1 dòng, chép đúng định dạng dòng mẫu
  rows.forEach((o,i)=>{ const r=R+i, row=ws.getRow(r), D={...S,...o}; if(tpl.h) row.height=tpl.h;
    tpl.c.forEach((t,k)=>{ const c=row.getCell(k+1); c.style=sclone(t.st); if(t.v!==undefined&&t.v!==null){ c.value=fillV(t.v,D); if(codesIn(t.v).length) chk.push([c.address,vText(c.value)]); } });
    mRow.forEach(m=>ws.mergeCells(r,m.left,r,m.right));
    if(plan.hook==='loai'){ if(o._loai) tplCols.forEach(k=>row.getCell(k).fill=sclone(YEL)); if(nameCol>0) yel.push([colL(nameCol)+r,!!o._loai,o.HO_TEN]); } });
  // 4) phần dưới dời xuống
  foot.forEach((f,j)=>{ const r=R+1+j+d, row=ws.getRow(r); if(f.h) row.height=f.h; if(f.hid) row.hidden=true;
    f.c.forEach((t,k)=>{ const c=row.getCell(k+1); c.style=sclone(t.st); if(t.v!==undefined&&t.v!==null){ c.value=fillV(t.v,S); if(codesIn(t.v).length) chk.push([c.address,vText(c.value)]); } }); });
  mFoot.forEach(m=>ws.mergeCells(m.top+d,m.left,m.bottom+d,m.right));
  // 5) vùng in, vùng lọc, dòng lặp tiêu đề
  if(ws.pageSetup.printArea) ws.pageSetup.printArea=shiftArea(ws.pageSetup.printArea,R,d,true);
  if(ws.autoFilter){ if(typeof ws.autoFilter==='string') ws.autoFilter=shiftArea(ws.autoFilter,R,d);
    else if(ws.autoFilter.from&&ws.autoFilter.to&&typeof ws.autoFilter.from==='string'){ const t=shiftArea(ws.autoFilter.from+':'+ws.autoFilter.to,R,d).split(':'); ws.autoFilter={from:t[0],to:t[1]}; } }
  if(ws.pageSetup.printTitlesRow){ const t=String(ws.pageSetup.printTitlesRow).split(':').map(Number); if(t[0]>R) ws.pageSetup.printTitlesRow=`${t[0]+d}:${t[1]+d}`; }
  return {chk,yel,d};
}
/* chạy form: plans=[{src: thứ tự sheet trong form, name: tên sheet xuất, S, rows, hook}] → {wb (để tải), buf, sheets:[…để đối chiếu]} */
async function fillForm(buf,id,plans){
  const DR=formDrawings(buf);
  const wb=new ExcelJS.Workbook(); await wb.xlsx.load(stripDrawings(buf));
  const A=analyzeForm(wb,id);
  plans.forEach(p=>{ const nm=A.info[p.src]&&A.info[p.src].ws.name; if(nm&&DR[nm]&&DR[nm].chart) A.E.push(`Sheet “${nm}” có biểu đồ — tool không chép được biểu đồ, xóa biểu đồ khỏi form.`); });
  if(A.E.length) throw new FormErr(A.E);
  const used=[], res=[];
  for(const p of plans){ const I=A.info[p.src], ws=I.ws, orig=ws.name;
    const r=fillSheet(ws,p,I.R); used.push(ws); res.push({name:p.name.slice(0,31),orig,R:I.R,d:r.d,chk:r.chk,yel:r.yel,n:p.rows.length}); }
  wb.worksheets.slice().forEach(w=>{ if(!used.includes(w)) wb.removeWorksheet(w.id); });
  used.forEach((w,i)=>w.name='__tmp'+i); used.forEach((w,i)=>{ w.name=res[i].name; });
  let out=await wb.xlsx.writeBuffer();
  const items=res.filter(s=>DR[s.orig]).map(s=>({name:s.name,R:s.R,d:s.d,...DR[s.orig]}));
  if(items.length) out=injectDrawings(out,items);
  // tự kiểm: đủ hình vẽ như form
  const z=zOpen(out), got={}; zSheets(z).forEach(sh=>{ const dr=zParseRels(zGet(z,zRels(sh.path))).find(r=>/\/drawing$/.test(r.type)); got[sh.name]=dr?anchorCount(zGet(z,zJoin(zDir(sh.path),dr.target))):0; });
  res.forEach(s=>{ const want=DR[s.orig]?DR[s.orig].n:0; if(got[s.name]!==want) throw new FormErr([`Sheet ${s.name}: form có ${want} hình vẽ/đường kẻ, file xuất có ${got[s.name]||0}.`]); });
  return {wb:{xlsx:{writeBuffer:async()=>out}}, buf:out, sheets:res, warns:A.W};
}
/* đối chiếu file đã ghi (đọc lại) với dữ liệu: mọi ô có mã, bôi vàng người bị loại, không còn sót mã */
function verifyForm(back,r){
  const P=[];
  for(const s of r.sheets){ const w=back.getWorksheet(s.name); if(!w){ P.push('Thiếu sheet '+s.name); continue; }
    for(const [a,t] of s.chk){ const got=vText(w.getCell(a).value); if(got!==t) P.push(`${s.name} ô ${a}: file ghi “${got}”, đúng phải là “${t}”`); }
    for(const [a,y,ten] of s.yel){ const f=w.getCell(a).fill, isY=!!(f&&f.fgColor&&/FFFF00$/i.test(f.fgColor.argb||'')); if(isY!==y) P.push(`${s.name} ô ${a} ${ten}: ${y?'bị loại nhưng chưa bôi vàng':'không bị loại nhưng lại bôi vàng'}`); }
    w.eachRow({includeEmpty:false},row=>row.eachCell({includeEmpty:false},c=>{ if(c.type!==ExcelJS.ValueType.Merge&&codesIn(c.value).length) P.push(`${s.name} ô ${c.address}: còn sót mã “${vText(c.value)}”`); }));
  }
  return P;
}

/* vẽ sheet thành bảng HTML để xem thử (giá trị, ô gộp, chữ đậm, nền) */
function sheetHTML(w,maxR=60,maxC=16){
  const nr=Math.min(w.rowCount,maxR), nc=Math.min(Math.max(w.columnCount,1),maxC), M={}, skip=new Set();
  Object.values(w._merges).forEach(m=>{ M[m.top+':'+m.left]=m; for(let r=m.top;r<=m.bottom;r++) for(let k=m.left;k<=m.right;k++) if(r!==m.top||k!==m.left) skip.add(r+':'+k); });
  let h='<table><tr><td class="rn"></td>'+Array.from({length:nc},(_,k)=>`<td class="rn" style="width:${Math.round((w.getColumn(k+1).width||9)*6)}px">${colL(k+1)}</td>`).join('')+'</tr>';
  for(let r=1;r<=nr;r++){ const row=w.getRow(r); if(row.hidden) continue; h+=`<tr><td class="rn">${r}</td>`;
    for(let k=1;k<=nc;k++){ if(skip.has(r+':'+k)) continue; const c=row.getCell(k), m=M[r+':'+k], f=c.font||{}, al=c.alignment||{}, fl=c.fill;
      const bg=fl&&fl.fgColor&&fl.fgColor.argb?'#'+fl.fgColor.argb.slice(-6):'';
      const st=[f.bold&&'font-weight:700',f.italic&&'font-style:italic',bg&&'background:'+bg,al.horizontal&&'text-align:'+al.horizontal].filter(Boolean).join(';');
      h+=`<td${al.wrapText?' class="w"':''}${m?` rowspan="${Math.min(m.bottom,nr)-m.top+1}" colspan="${Math.min(m.right,nc)-m.left+1}"`:''}${st?` style="${st}"`:''}>${esc(vText(c.value))}</td>`; }
    h+='</tr>'; }
  return h+'</table>'+(w.rowCount>maxR?`<div class="muted" style="font-size:12px;padding:4px 6px">… còn ${w.rowCount-maxR} dòng</div>`:'');
}

let FORM_ID=null;
async function formStore(id,buf,name){
  const fid=id+'_'+Date.now(); await idbSet('form:'+fid,buf);
  DB.forms=DB.forms||{}; const f=DB.forms[id]=DB.forms[id]||{cur:null,list:[]};
  f.list.unshift({fid,name,t:new Date().toISOString(),size:buf.byteLength}); f.cur=fid;
  if(f.list.length>10) f.list.splice(10).forEach(x=>idbDel('form:'+x.fid).catch(()=>{}));
  save(); render(); toast(`Từ giờ ${FORM_DEF[id].ten} xuất theo form “${name}” — áp dụng mọi khóa.`,5000);
}
async function formUpload(file){
  const id=FORM_ID; if(!file||!id) return;
  if(!/\.xlsx$/i.test(file.name)){ toast('Form phải là file .xlsx (Excel). File .xls cũ: mở bằng Excel rồi Lưu thành .xlsx.',6000); return; }
  if(file.size>20*1024*1024){ toast('File form lớn hơn 20 MB.',5000); return; }
  const buf=await file.arrayBuffer();
  await formPreview(id,buf,file.name,()=>{ formStore(id,buf,file.name).catch(e=>toast('Trình duyệt không lưu được form: '+e.message,6000)); });
}
function bindForms(root){
  root.querySelectorAll('[data-fdef]').forEach(b=>b.onclick=async e=>{ e.preventDefault(); const id=b.dataset.fdef; try{ dlBuf(await formDefaultBuf(id),FORM_DEF[id].file); }catch(err){ toast('Lỗi tạo form: '+err.message,5000); } });
  root.querySelectorAll('[data-fbcdn]').forEach(b=>b.onclick=e=>{ e.preventDefault(); dlBlob(tplBytes('bcdnTpl'),'FORM_BC_DN_TC_SH.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document'); });
  root.querySelectorAll('[data-fbcdt]').forEach(b=>b.onclick=e=>{ e.preventDefault(); dlBlob(tplBytes('bcdtTpl'),'FORM_BC_DAO_TAO_KHOA_HOC.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document'); });
  root.querySelectorAll('[data-ftb]').forEach(b=>b.onclick=e=>{ e.preventDefault(); const bin=atob(document.getElementById('tbTpl').textContent.trim()), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); dlBuf(u,'FORM_THONGBAO.xlsx'); });
  root.querySelectorAll('[data-fup]').forEach(b=>b.onclick=e=>{ e.preventDefault(); FORM_ID=b.dataset.fup; $('#formIn').value=''; $('#formIn').click(); });
  root.querySelectorAll('[data-fcur]').forEach(b=>b.onclick=async e=>{ e.preventDefault(); const id=b.dataset.fcur, f=DB.forms[id], m=f.list.find(x=>x.fid===f.cur); const buf=await formLoad(id); if(buf) dlBuf(buf,m.name); });
  root.querySelectorAll('[data-freset]').forEach(b=>b.onclick=e=>{ e.preventDefault(); const id=b.dataset.freset;
    if(!confirm(`${FORM_DEF[id].ten}: quay về form gốc của tool?\n(Form đã sửa vẫn giữ trong danh sách “Form đã nạp”, chọn lại được.)`)) return;
    DB.forms[id].cur=null; save(); render(); toast(FORM_DEF[id].ten+': đã về form gốc của tool.'); });
  root.querySelectorAll('[data-fsel]').forEach(s=>s.onchange=async()=>{ const id=s.dataset.fsel, fid=s.value; s.value=''; if(!fid) return;
    const f=DB.forms[id], m=f.list.find(x=>x.fid===fid); if(fid===f.cur){ toast('Đang dùng form này.'); return; }
    try{ const buf=await idbGet('form:'+fid); if(!buf) throw new Error('không thấy nội dung form');
      await formPreview(id,buf,m.name,()=>{ f.cur=fid; save(); render(); toast(`${FORM_DEF[id].ten}: dùng lại form “${m.name}”.`); }); }
    catch(err){ toast('Không mở được form: '+err.message,5000); } });
}

function dsshRow(s,i){ return [i+1,s.ten,s.ns,s.cccd,s.dc,s.sk||'x',s.hangHS||s.hangG||'','',gcText(s)]; }
function dsshSheet(wb,name,S,R,isTL){
  const Y=DSSH_LAYOUT[isTL?'tl':'moi'];
  const ws=wb.addWorksheet(name.slice(0,31),{pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,margins:Y.margins}});
  Y.colw.forEach((w,i)=>ws.getColumn(i+1).width=w);
  Y.head.forEach((h,i)=>ws.getRow(i+1).height=h);
  const T={horizontal:'center',vertical:'middle'}, TN={style:'thin'};
  put(ws,'A1','Danh sách thí sinh dự sát hạch để cấp giấy phép lái xe',TNR(16,{bold:true}),T); ws.mergeCells('A1:I1');
  for(let k=1;k<=9;k++) ws.getRow(1).getCell(k).border={bottom:TN};
  let h=2;                                     // dòng đầu của tiêu đề cột
  // sheet -TL: không có 2 dòng “Hạng / Khóa” — tiêu đề cột ngay dưới dòng tên danh sách, giống sheet lần đầu
  const H=[['A','STT',10],['B','Họ và tên',10],['C','Ngày tháng\nnăm sinh',10],['D','Số định danh',10],['E','Nơi cư trú',10],['F','Giấy \nchứng nhận sức khỏe\nhợp lệ',10],['G','Đã có\ngiấy phép lái xe hạng ',10],['H','Số chứng chỉ sơ cấp, chứng chỉ đào tạo, xác nhận hoàn thành khóa đào tạo',9],['I','Ghi chú',10]];
  for(const [col,t,sz] of H){ put(ws,col+h,t,TNR(sz,{bold:true}),AC); ws.mergeCells(`${col}${h}:${col}${h+2}`); }
  for(let r=h;r<=h+3;r++) for(let k=0;k<9;k++) ws.getRow(r).getCell(k+1).border=BOX;
  const nr=h+3;                                 // dòng (1) (2) … (9)
  for(let k=0;k<9;k++){ const cell=ws.getRow(nr).getCell(k+1); cell.value=`(${k+1})`; cell.font=TNR(k<8?11:10,{italic:true}); cell.alignment=AC; }
  const d0=nr+1;
  R.forEach((o,i)=>{
    const row=ws.getRow(d0+i); row.height=Y.data;
    [o.STT,o.HO_TEN,o.NGAY_SINH,o.CCCD,o.NOI_CU_TRU,o.CNSK,o.HANG_GPLX,'',o.NOI_DUNG_SH].forEach((v,j)=>{ const cell=row.getCell(j+1); cell.value=v; cell.border=BOX;
      cell.font=TNR(j===0?12:j===1?14:11);
      cell.alignment=(j===1||j===4)?ALn:(j===8?{horizontal:Y.gcAlign||undefined,vertical:'middle',shrinkToFit:true}:{horizontal:'center',vertical:'middle'});
      if(j===3) cell.numFmt='@'; });
    if(o.PHU_TRACH){ const p=row.getCell(13); p.value=o.PHU_TRACH; p.font=TNR(11); }
  });
  const last=d0+R.length-1, tr=last+1;
  ws.autoFilter=`A${nr}:I${last}`;
  ws.getRow(tr).height=Y.tong;
  put(ws,'A'+tr,`Tổng số : ${S.TONG} Thí sinh`,TNR(16,{bold:true}),{horizontal:'left',vertical:'middle'});
  for(let k=1;k<=9;k++){ const cell=ws.getRow(tr).getCell(k); cell.border={top:TN}; if(k>1) cell.font=TNR(16,{bold:true}); }
  ws.pageSetup.printArea=`A$1:I$${tr}`;
  ws._d0=d0; ws._tr=tr;
  return ws;
}
async function exportDSSH(){
  const c=C(), moi=bc2MoiList(), tl=tlList(false);

  if(!moi.length&&!confirm('Khóa này chưa có danh sách thi lần đầu — chỉ xuất sheet thi lại?')) return;
  if(!tl.length&&!confirm('Khóa này chưa có danh sách thi lại — chỉ xuất sheet lần đầu?')) return;
  const bc1Order=bc1List().filter(x=>!x.biLoai).map(x=>x.cccd).join(',');
  const common=P=>{
    if(moi.length&&moi.map(x=>x.cccd).join(',')!==bc1Order) P.push('Sheet lần đầu không đúng thứ tự BC1/BC2');
    if(moi.some(x=>x.biLoai)||tl.some(x=>x.biLoai)) P.push('Có người bị loại vẫn nằm trong danh sách');
    return P; };
  const F=await formLoad('dssh'); if(F===false) return;
  let wb, verify;
  if(F){ const plans=[]; if(moi.length) plans.push({src:0,name:c.ten,S:bc2Scal(c,moi.length),rows:moi.map(bc2Row)}); if(tl.length) plans.push({src:1,name:c.ten+'-TL',S:bc2Scal(c,tl.length),rows:tl.map(bc2Row)});
    const r=await formRun(F,'dssh',plans); if(!r) return; wb=r.wb; verify=back=>common(verifyForm(back,r)); }
  else{
  wb=new ExcelJS.Workbook(); wb.creator='TOOLS BC1+BC2+SBD';
  const W=[]; if(moi.length) W.push([dsshSheet(wb,c.ten,bc2Scal(c,moi.length),moi.map(bc2Row),false),moi,c.ten]); if(tl.length) W.push([dsshSheet(wb,c.ten+'-TL',bc2Scal(c,tl.length),tl.map(bc2Row),true),tl,c.ten+'-TL']);
  verify=back=>{
    const P=[];
    for(const [w0,L,nm] of W){ const w=back.getWorksheet(nm.slice(0,31)); if(!w){ P.push('Thiếu sheet '+nm); continue; }
      P.push(...verifyRows(w,w0._d0,L.map(dsshRow),['A','B','C','D','E','F','G','H','I'],'DS '+nm));
      if(cellStr(w,'A'+w0._tr)!==`Tổng số : ${L.length} Thí sinh`) P.push(`Sheet ${nm}: dòng tổng ghi “${cellStr(w,'A'+w0._tr)}”`); }
    return common(P); };
  }
  await download(wb,`DSSATHACH_${asciiName(c.ten)}.xlsx`, verify);
}
async function exportBC2(){

    return common(P); }, buf=>{ lastBuf=addLines(buf, wb.worksheets.map((w,i)=>({idx:i+1, lines:w._lines}))); return lastBuf; });
}

async function exportSBD(ex){
  ex=ex||curExam(); if(!ex){ toast('Chưa có khóa thi.'); return; }
  if(examBad(ex)){ toast('Danh sách này không phải từ file GLĐ — không xuất.',5000); return; }
  const cfg=sbdCfgGet(), st=examStats(ex), S=sbdScal(cfg,ex,st), R=ex.rows.map(sbdRow);
  const F=await formLoad('sbd'); if(F===false) return;
  let wb, FR=null;
  if(F){ FR=await formRun(F,'sbd',[{src:0,name:ex.khoaThi,S,rows:R}]); if(!FR) return; wb=FR.wb; }
  else{ wb=new ExcelJS.Workbook(); wb.creator='So Sat Hach A1'; sbdSheet(wb,ex.khoaThi,S,R); }
  for(const c of Object.values(DB.courses)) if(c.sbd&&c.sbd.server&&c.sbd.server.khoaThi===ex.khoaThi) c.lastSBD=new Date().toISOString();
  save();
  const chk=examCheck(ex);

let QTT='';
function analyzeThiThu(wb,file,pn){
  const out=[];
  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn]; if(!ws||!ws['!ref']) continue;
    const rg=XLSX.utils.decode_range(ws['!ref']);
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:'',blankrows:true});
    const h=mapHeader(rows); if(!h) continue;
    const {r:hr,map}=h; if(map.id==null||map.ten==null) continue;
    const hasSbd=map.sbd!=null, recs=[], skipped=[];
    const cellAt=(r,c)=>c==null?null:ws[XLSX.utils.encode_cell({r:rg.s.r+r,c:rg.s.c+c})];
    const txtAt=(r,c)=>{ const x=cellAt(r,c); if(!x||x.v==null) return ''; if(typeof x.v==='number') return String(x.v); return String(x.v).replace(/^\s+|\s+$/g,''); };
    for(let r=hr+1;r<rows.length;r++){
      // Giữ NGUYÊN thứ tự và giá trị gốc của file; chỉ chuyển kiểu khi ô là số và ghi lại cảnh báo (giống mục Số báo danh)
      const flags=[];
      let sb='';
      if(hasSbd){ const sbX=cellAt(r,map.sbd); sb=txtAt(r,map.sbd); if(sbX&&typeof sbX.v==='number'&&Number.isInteger(sbX.v)) sb=String(sbX.v); }
      const tenR=txtAt(r,map.ten);
      const cX=cellAt(r,map.id); let cmt=txtAt(r,map.id);
      if(cX&&typeof cX.v==='number'){ cmt=String(Math.round(cX.v)); if(cmt.length===11||cmt.length===8){ cmt='0'+cmt; flags.push('Số CMT lưu dạng số trong file gốc — đã bổ sung số 0 ở đầu'); } }
      const nX=cellAt(r,map.ns); let ns=txtAt(r,map.ns);
      if(nX&&typeof nX.v==='number'){ ns=fmtDate(nX.v); flags.push('Ngày sinh lưu dạng số trong file gốc — đã chuyển sang dd/mm/yyyy'); }
      const hang=txtAt(r,map.hangG!=null?map.hangG:map.hang), nd=txtAt(r,map.nd!=null?map.nd:map.gc);
      if(!tenR&&!cmt) continue;
      if(/^\(\d+\)$/.test(tenR)) continue;
      const miss=[hasSbd&&!sb&&'SBD',!tenR&&'họ tên',!cmt&&'số CMT'].filter(Boolean);
      if(miss.length){ skipped.push({row:rg.s.r+r+1, ten:tenR, id:cmt, reason:'Thiếu '+miss.join(', ')}); continue; }
      recs.push({sbd:sb, ten:tenR, cmt, id:normId(cmt), ns, hang, nd, flags, row:rg.s.r+r+1});
    }
    if(!hasSbd) recs.forEach((x,i)=>x.sbd=String(i+1));     // file không có cột SBD: đánh số theo đúng thứ tự dòng trong file
    const cells=rows.slice(0,hr).flat().map(v=>String(v??'').trim()).filter(Boolean);
    const kt=cells.map(v=>v.match(/[A-ZĐ]{2,5}-\d{4}-K\d+/)).find(Boolean);
    const nt=cells.map(v=>v.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/)).find(Boolean);
    const item={file:file.name, sheet:sn, kind:'thithu', target:'thithu', recs, skipped, hasSbd, label:pn.khoa,
      khoaThi:kt?kt[0]:pn.khoa, ngayThi:nt?pad(nt[1],2)+'/'+pad(nt[2],2)+'/'+nt[3]:''};
    for(const row of rows.slice(0,hr)){ const i=row.findIndex(v=>/^tong so/.test(norm(v))); if(i<0) continue;
      const v=row.slice(i+1).find(x=>String(x).trim()!==''); if(v!=null&&/^\d+$/.test(String(v).trim())){ item.tongSo=+String(v).trim(); break; } }
    if(!hasSbd) item.note='File không có cột SBD — SBD đánh 1, 2, 3… theo đúng thứ tự dòng trong file (không sắp lại).';
    if(recs.length||skipped.length) out.push(item);
  }
  let L=out.some(x=>x.hasSbd)? out.filter(x=>x.hasSbd) : out;
  if(L.length>1) L.forEach(x=>{ x.target='skip'; x.userLock=true; x.nameMsg=`File có ${L.length} sheet danh sách — mỗi file thi thử chỉ được 1 danh sách. Không nạp, kiểm tra lại file.`; });
  if(!L.length) toast(`“${file.name}” tên _Thithu nhưng không tìm thấy danh sách (cột họ tên + số CMT/CCCD) — không nạp.`,6000);
  return L;
}

    DB.thithu.unshift(t); last=t; msg.push(`Thi thử ${t.label}: ${t.rows.length} thí sinh${t.skipped.length?`, ${t.skipped.length} dòng thiếu thông tin không nạp`:''}`);
    p.target='skip'; p.ttDone=true;
  }
  if(last) DB.curTT=last.id;
  save();
  if(msg.length) toast(msg.join(' · '),5000);
  if(pending.some(p=>p.target!=='skip')) return false;      // còn file khác → quy trình nạp chung chạy tiếp như cũ
  pending=[]; if(last){ TAB='tt'; QTT=''; } render(); return true;
}

const AUD_F=['ten','ns','cccd','dc','sk','hangHS','soGPLX','loai','biLoai','lyDo','gcTL','phuTrach'];

function audSnap(c){ const m=new Map(); for(const s of c.students){ const o={}; for(const k of AUD_F) o[k]=k==='biLoai'?!!s[k]:(s[k]??''); m.set(audKey(s),o); } return m; }

const audVal=(k,v)=>k==='biLoai'?(v?'có':'không'):k==='loai'?(v==='moi'?'Học mới':v==='tl'?'Thi lại':v):k==='gcTL'?(GC_LABEL[v]||v||'(trống)'):(v===''?'(trống)':String(v));
function audFlush(){
  const ctx=AUDCTX||{lb:'Sửa trực tiếp',r:''}; AUDCTX=null; const t=nowIso(), b=Date.now().toString(36), u=userName();
  for(const c of Object.values(DB.courses)){
    const prev=AUDP.get(c.id), cur=audSnap(c); AUDP.set(c.id,cur); if(!prev) continue;
    const E=[];
    const mk=(o,p,a,f)=>{ const s=o||p; const lk=c.lastBC2?'BC2':(c.lastBC1&&(s.loai==='moi'||(p&&p.loai==='moi')))?'BC1':'';
      const e={t,u,b,lb:ctx.lb,r:ctx.r,id:s.cccd,ten:s.ten,a,f}; if(lk){ e.st=lk; if(!ctx.r) e.nr=1; } return e; };
    for(const [k,o] of cur){ const p=prev.get(k);
      if(!p){ E.push(mk(o,null,'thêm',[])); continue; }
      const f=AUD_F.filter(x=>String(p[x])!==String(o[x])); if(!f.length) continue;
      E.push(mk(o,p,p.biLoai!==o.biLoai?(o.biLoai?'loại':'bỏ loại'):'sửa',f.map(x=>[x,p[x],o[x]]))); }
    for(const [k,p] of prev) if(!cur.has(k)) E.push(mk(null,p,'xóa',[]));
    if(!E.length) continue;
    let keep=E;
    if(E.length>200){   // nạp hàng loạt: ghi gọn 1 dòng tổng, chỉ giữ chi tiết những thay đổi quan trọng
      keep=E.filter(e=>e.st||['loại','bỏ loại','xóa'].includes(e.a));
      const cnt={}; E.forEach(e=>cnt[e.a]=(cnt[e.a]||0)+1);
      keep.unshift({t,u,b,lb:ctx.lb,r:ctx.r,a:'hàng loạt',n:E.length,cnt}); }
    c.audit=(c.audit||[]).concat(keep); if(c.audit.length>6000) c.audit=c.audit.slice(-6000);
  }
}

    const u=u8(buf), c=(cid&&DB.courses[cid])||C(), sha=await sha256(u);

}

  add('DANH_MUC.json',enc.encode(JSON.stringify({tool:'TOOLS BC1+BC2+SBD v'+APP_VER,khoa:c.ten,dong_goi_luc:nowIso(),nguoi:userName(),files:man},null,1)));
  add('DOC_TOI.txt',enc.encode(`Gói hồ sơ khóa ${c.ten} — đóng gói lúc ${fmtDT(nowIso())}${userName()?' bởi '+userName():''}\r\n\r\n`+
    `xuat_ra/  : các file tool đã xuất (BC1, BC2, PC-08, DS thí sinh, SBD...) đúng bản đã tải về lúc đó\r\nnap_vao/  : các file đã nạp vào tool (hồ sơ, GLĐ, XML...)\r\ndu_lieu_khoa.json : toàn bộ dữ liệu khóa trong tool\r\nDANH_MUC.json : danh mục file kèm mã kiểm tra SHA-256\r\n\r\n`+
    man.map(m=>`${m.sha256}  ${m.file}`).join('\r\n')));
  const out=XLSX.CFB.write(z,{fileType:'zip',type:'array',compression:true}), buf=u8(out);
  const name=`HOSO_${asciiName(c.ten)}_${dstamp()}.zip`;
  dlBlob(buf,name,'application/zip');

  return buf;
}

/* ================== GOOGLE DRIVE (qua Google Drive cho máy tính) — tự sao lưu vào thư mục ================== */
const DRV={h:null,state:'none',busy:false,again:false,quiet:false,t:null,preUp:null,remote:null};
const DRV_MAIN='du_lieu_moi_nhat.json';
async function drvPerm(ask){
  if(!DRV.h){ DRV.state='none'; return false; }
  let p='granted';
  try{ if(DRV.h.queryPermission) p=await DRV.h.queryPermission({mode:'readwrite'}); if(p!=='granted'&&ask&&DRV.h.requestPermission) p=await DRV.h.requestPermission({mode:'readwrite'}); }catch(e){ p='denied'; }
  DRV.state=p==='granted'?'ok':'need'; return DRV.state==='ok';
}
async function drvDir(path,create=true){ let d=DRV.h; for(const p of String(path).split('/').filter(Boolean)) d=await d.getDirectoryHandle(p,{create}); return d; }
async function drvWrite(path,data){ const P=path.split('/'), n=P.pop(), d=await drvDir(P.join('/')); const f=await d.getFileHandle(n,{create:true}); const w=await f.createWritable(); await w.write(data); await w.close(); }
async function drvFile(path){ try{ const P=path.split('/'), n=P.pop(), d=await drvDir(P.join('/'),false); return await (await d.getFileHandle(n)).getFile(); }catch(e){ return null; } }
async function drvRead(path){ const f=await drvFile(path); return f?await f.text():null; }
async function drvReadBin(path){ const f=await drvFile(path); return f?u8(await f.arrayBuffer()):null; }
async function drvList(dir){ const out=[]; try{ const d=await drvDir(dir,false); for await (const [n,h] of d.entries()) if(h.kind==='file') out.push(n); }catch(e){} return out.sort(); }
async function drvRemove(dir,n){ try{ const d=await drvDir(dir,false); await d.removeEntry(n); }catch(e){} }
function drvSchedule(ms){ if(!DRV.h||DRV.state!=='ok'||(DB.drive&&DB.drive.auto===false)) return; clearTimeout(DRV.t); DRV.t=setTimeout(()=>drvBackup('tự động'),ms==null?15000:ms); }
function writeQuiet(){ DRV.quiet=true; try{ writeNow(); }finally{ DRV.quiet=false; } }
async function drvBackup(why,manual){
  if(DRV.busy){ DRV.again=true; return false; }
  if(!(await drvPerm(!!manual))){ renderSide(); if(manual) toast('Chưa được phép ghi vào thư mục Google Drive.',5000); return false; }
  DRV.busy=true; renderSide(); let ok=false;
  try{
    if(saveT){ clearTimeout(saveT); saveT=null; writeQuiet(); }
    const txt=await makeBackupText();
    await drvWrite(DRV_MAIN,txt);
    await drvWrite(`saoluu/SAOLUU_${dstamp()}.json`,txt);
    if(DRV.preUp){ await drvWrite(`saoluu/TRUOC_NANG_CAP_v${DRV.preUp}_len_v${APP_VER}_${dstamp()}.json`,DRV.preUpText||txt); DRV.preUp=null; DRV.preUpText=null; }
    await drvPrune();
    for(const a of (DB.arc||[]).filter(a=>!a.drv)){ let b=null; try{ b=await idbGet('arc:'+a.id); }catch(e){} if(b){ await drvWrite(arcPath(a),u8(b)); a.drv=1; } }
    if(!await drvRead('DOC_TOI.txt')) await drvWrite('DOC_TOI.txt',DRV_README);
    DB.drive=DB.drive||{}; DB.drive.last=nowIso(); DB.drive.err=''; DB.drive.n=(DB.drive.n||0)+1; DB.lastBackup=DB.drive.last; DRV.remoteT=DB._t;
    bkLog(manual?'drive-tay':'drive-auto',`${DRV_MAIN} + saoluu/SAOLUU_${dstamp()}.json`,txt.length);
    ok=true;
  }catch(e){ DB.drive=DB.drive||{}; DB.drive.err=(e&&e.message)||String(e); DB.drive.errT=nowIso(); logErr('Sao lưu Drive: '+DB.drive.err,'drvBackup'); if(manual) toast('Lỗi ghi Google Drive: '+DB.drive.err,6000); }
  finally{ DRV.busy=false; writeQuiet(); renderSide(); if(DRV.again){ DRV.again=false; drvSchedule(3000); } }
  if(ok&&manual) toast('Đã sao lưu lên thư mục Google Drive “'+(DRV.h.name||'')+'”.',4000);
  return ok;
}
/* giữ 30 ngày gần nhất + bản cuối mỗi tháng; không xóa bản “trước nâng cấp” */
async function drvPrune(){
  const L=(await drvList('saoluu')).filter(n=>/^SAOLUU_\d{4}-\d{2}-\d{2}\.json$/.test(n)).sort().reverse();
  const keep=new Set(L.slice(0,30)), month=new Set();
  for(const n of L){ const m=n.slice(7,14); if(!month.has(m)){ month.add(m); keep.add(n); } }
  for(const n of L) if(!keep.has(n)) await drvRemove('saoluu',n);
}
const DRV_README=`THƯ MỤC SAO LƯU CỦA TOOLS BC1+BC2+SBD\r\n\r\n`+
 `du_lieu_moi_nhat.json : toàn bộ dữ liệu tool, tự ghi lại sau mỗi lần thay đổi (khoảng 15 giây sau)\r\n`+
 `saoluu/               : bản sao lưu theo ngày (giữ 30 ngày gần nhất + bản cuối mỗi tháng) và bản trước mỗi lần nâng cấp tool\r\n`+

 `ĐỪNG sửa tay các file .json trong thư mục này (tool kiểm tra mã SHA-256, file bị sửa sẽ bị cảnh báo).\r\n`;
async function drvLink(handle){
  let h=handle;
  if(!h){
    if(!window.showDirectoryPicker){ dialog('Trình duyệt không hỗ trợ',`<div class="note warn">${ic('alert')}<span>Chức năng ghi vào thư mục chỉ có trên <b>Google Chrome</b> hoặc <b>Microsoft Edge</b> bản mới. Hãy mở tool bằng Chrome.</span></div>`,[['Đóng','pri']]); return false; }

    catch(e){ if(e.name!=='AbortError') toast('Không chọn được thư mục: '+e.message,5000); return false; }
  }
  DRV.h=h; try{ await idbSet('drvHandle',h); }catch(e){ /* trình duyệt không lưu được liên kết → mỗi lần mở phải chọn lại */ DRV.noPersist=true; }
  DB.drive={...(DB.drive||{}),name:h.name,t:nowIso(),auto:true,err:''};
  await drvPerm(true); writeQuiet(); renderSide();

  const remote=await drvRead(DRV_MAIN);
  if(remote){ const info=await peekBackup(remote);
    if(info&&(!hasData()||(info.t||0)>(DB._t||0)+2000)){ await restoreFlow(remote,`thư mục Google Drive “${h.name}”`,true); render(); return true; } }
  await drvBackup('liên kết',true); render(); return true;
}
async function drvLoad(){
  try{ const h=await idbGet('drvHandle'); if(h){ DRV.h=h; await drvPerm(false); } }catch(e){}
  renderSide();
  if(DRV.state==='ok') await drvCompare();
}
/* lúc mở tool: thư mục Drive có dữ liệu mới hơn (sửa trên máy khác) hoặc tool đang trống → hỏi khôi phục */
async function drvCompare(){
  const remote=await drvRead(DRV_MAIN); if(!remote) { drvSchedule(2000); return; }
  const info=await peekBackup(remote); if(!info) return;
  if(!hasData()&&info.n){ await restoreFlow(remote,`thư mục Google Drive “${DRV.h.name}”`,true); return; }
  if((info.t||0)>(DB._t||0)+2000){
    dialog('Trên Google Drive có dữ liệu mới hơn',`<div class="note warn">${ic('alert')}<span>Bản trên thư mục Drive cập nhật lúc <b>${fmtDT(new Date(info.t).toISOString())}</b>, mới hơn dữ liệu trong trình duyệt này (<b>${DB._t?fmtDT(new Date(DB._t).toISOString()):'—'}</b>) — có thể đã làm trên máy khác.</span></div>

      [['Giữ dữ liệu máy này','',()=>{ drvSchedule(2000); }],['Xem & khôi phục','pri',()=>{ setTimeout(()=>restoreFlow(remote,`thư mục Google Drive “${DRV.h.name}”`,true),0); }]]);
  } else drvSchedule(5000);
}

}
async function makeBackupText(plain){

/* đọc nhanh thông tin bản sao lưu (không giải mã nếu chưa có khóa) */
async function peekBackup(text){
  try{ const o=JSON.parse(text);
    if(o._enc){ if(!SEC.key||!DB.sec||o.salt!==DB.sec.salt) return {t:0,enc:true,n:1}; const d=JSON.parse(await decWithKey(o,SEC.key)); return {t:d._t||0,n:Object.values(d.courses||{}).reduce((t,c)=>t+c.students.length,0)+(d.exams||[]).length}; }
    return {t:o._t||0,n:Object.values(o.courses||{}).reduce((t,c)=>t+c.students.length,0)+(o.exams||[]).length};
  }catch(e){ return null; }
}
async function parseBackup(text){
  let o; try{ o=JSON.parse(text); }catch(e){ throw new Error('File không đúng định dạng sao lưu của tool.'); }
  let enc=false;
  if(o&&o._enc){ enc=true; let s=null;
    if(SEC.key&&DB.sec&&o.salt===DB.sec.salt){ try{ s=await decWithKey(o,SEC.key); }catch(e){} }
    while(s==null){ const pin=await askPin('File sao lưu đã mã hóa','Nhập mã PIN đang dùng lúc tạo bản sao lưu này:'); if(pin==null) throw new Error('Đã hủy');
      try{ s=await decText(o,pin); }catch(e){ alert(e.message); } }
    o=JSON.parse(s); }
  let shaOk=null; if(o._sha){ const h=o._sha; delete o._sha; shaOk=(await sha256(JSON.stringify(o)))===h; }
  if(!o.courses||typeof o.courses!=='object') throw new Error('Không phải file sao lưu của tool.');
  return {o,shaOk,enc};
}

function applyRestore(o,mode,pick,src){

  const _mau=o._mau||{}, _form=o._form||{}; ['_ver','_luc','_mau','_form','_may'].forEach(k=>delete o[k]);
  for(const id in _mau) idbSet('mau:'+id,b64d(_mau[id]).buffer).catch(()=>{});
  for(const fid in _form) idbSet('form:'+fid,b64d(_form[fid]).buffer).catch(()=>{});
  const stamp={t:nowIso(),files:['Khôi phục từ '+src],u:userName()};

    const arc=DB.arc||[];
    DB=o; Object.assign(DB,{sec:keep.sec,drive:keep.drive,_appVer:keep._appVer,users:[...new Set([...(o.users||[]),...(keep.users||[])])],
      xlog:[...(o.xlog||[]),...(keep.xlog||[]).filter(x=>!(o.xlog||[]).some(y=>y.t===x.t&&y.file===x.file))].slice(-500),
      arc:[...(o.arc||[]),...arc.filter(a=>!(o.arc||[]).some(b=>b.id===a.id))]});
    Object.values(DB.courses).forEach(c=>(c.log=c.log||[]).push(stamp));
  } else {
    for(const r of pick){ const k=r.k; if(r.m&&r.m.id!==k.id) delete DB.courses[r.m.id]; DB.courses[k.id]=k; (k.log=k.log||[]).push(stamp); }
    DB.exams=DB.exams||[];
    for(const e of (o.exams||[])){ const i=DB.exams.findIndex(x=>norm(asciiName(x.khoaThi))===norm(asciiName(e.khoaThi))); if(i>=0) DB.exams[i]=e; else DB.exams.push(e); }
    DB.arc=[...(DB.arc||[]),...(o.arc||[]).filter(a=>!(DB.arc||[]).some(b=>b.id===a.id))];
    if((o.thithu||[]).length){ DB.thithu=DB.thithu||[]; for(const e of o.thithu){ const i=DB.thithu.findIndex(x=>ttSame(x.label,e.label)); if(i>=0) DB.thithu[i]=e; else DB.thithu.push(e); } }
    if(!Object.keys(DB.forms||{}).length&&o.forms) DB.forms=o.forms;
    if(!Object.keys(DB.mau||{}).length&&o.mau) DB.mau=o.mau;
    if(!DB.courses[DB.cur]) DB.cur=pick[0].k.id;
  }
  DB.bkLog=[...(bkKeep||[]),...((DB.bkLog||[]).filter(x=>!(bkKeep||[]).some(y=>y.t===x.t&&y.kind===x.kind)))].sort((a,b)=>a.t.localeCompare(b.t)).slice(-300);
  bkLog('khoiphuc',src,0,{mode});
  normalizeDB(); KEYCACHE.clear(); audReset(); pending=[]; SEL.clear(); writeNow(); render();
  toast(mode==='all'?'Đã khôi phục toàn bộ dữ liệu.':`Đã khôi phục ${pick.length} khóa.`,5000);
}

/* ================== BẢO MẬT: mã PIN mở tool + mã hóa bản sao lưu (AES-GCM 256, khóa sinh từ PIN bằng PBKDF2) ================== */
const SEC={key:null,last:Date.now(),locked:false};
async function pbkdf2(pin,saltB64,bits=256){ const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(saltB64),iterations:150000,hash:'SHA-256'},km,bits)); }
async function aesKey(pin,saltB64){ return crypto.subtle.importKey('raw',await pbkdf2(pin,saltB64),'AES-GCM',false,['encrypt','decrypt']); }
const rnd=n=>b64e(crypto.getRandomValues(new Uint8Array(n)));
async function pinOk(pin){ return !!DB.sec&&b64e(await pbkdf2(pin,DB.sec.hsalt))===DB.sec.hash; }
async function encText(s){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},SEC.key,new TextEncoder().encode(s));
  return JSON.stringify({_enc:'AES-GCM-256/PBKDF2-SHA256-150000',v:1,salt:DB.sec.salt,iv:b64e(iv),data:b64e(ct),_t:DB._t,_luc:nowIso(),_ver:APP_VER}); }
async function decWithKey(o,k){ const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},k,b64d(o.data)); return new TextDecoder().decode(pt); }
async function decText(o,pin){ try{ return await decWithKey(o,await aesKey(pin,o.salt)); }catch(e){ throw new Error('Sai mã PIN hoặc file đã hỏng.'); } }
function askPin(title,msg){ return new Promise(res=>{ let done=false;
  const d=dialog(title,`<div>${msg}</div><input type="password" id="pinIn" autocomplete="off" style="width:100%;margin-top:10px;font-size:18px;letter-spacing:4px">`,
    [['Hủy','',()=>{ done=true; res(null); }],['Đồng ý','pri',()=>{ done=true; res($('#pinIn').value); }]]);
  d.addEventListener('close',()=>{ if(!done){ done=true; res(null); } },{once:true});
  setTimeout(()=>{ const i=$('#pinIn'); if(i){ i.focus(); i.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#dlgF').lastChild.click(); } }; } },60); }); }
const RC_AB='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
async function setPin(pin){
  const rc=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>RC_AB[x%RC_AB.length]).join('').replace(/(.{4})(?!$)/g,'$1-');
  const sec={salt:rnd(16),hsalt:rnd(16),rsalt:rnd(16),enc:DB.sec?DB.sec.enc!==false:true,lock:DB.sec?DB.sec.lock:30,t:nowIso()};
  sec.hash=b64e(await pbkdf2(pin,sec.hsalt)); sec.rhash=b64e(await pbkdf2(rc.replace(/-/g,''),sec.rsalt));
  DB.sec=sec; SEC.key=await aesKey(pin,sec.salt); writeNow(); drvSchedule(2000); return rc;
}

  const lastX=re=>{ const L=X.filter(x=>re.test(x.file)); return L.length?L[L.length-1].t:null; };
  const ids=new Set(c.students.map(s=>s.cccd));

  const M=mocList(c,true), steps=M.reduce((t,m)=>t+m.steps.length,0), done=M.reduce((t,m)=>t+m.done.filter(Boolean).length,0);
  return {moi,tl,loai:c.students.filter(s=>s.biLoai).length,bc1:c.lastBC1,bc2:c.lastBC2,pc08:lastX(/^Danh sách Báo cáo 2 /),dssh:lastX(/^DSSATHACH_/),

}

}

/* ================== NÂNG CẤP, KHỞI ĐỘNG ================== */
function whenIdle(fn){ const d=$('#dlg'); if(d&&d.open) d.addEventListener('close',()=>setTimeout(()=>whenIdle(fn),250),{once:true}); else fn(); }
function preUpgrade(){
  const old=DB._appVer; if(old===APP_VER) return;
  if(hasData()){ snapshot(`Trước khi nâng cấp ${old?'v'+old:'bản cũ'} → v${APP_VER}`); DRV.preUp=old||'3.x'; makeBackupText().then(t=>{ DRV.preUpText=t; }).catch(()=>{}); }
  DB._appVer=APP_VER; writeQuiet();
  if(old) toast(`Đã nâng cấp từ v${old} lên v${APP_VER} — đã lưu bản trước khi nâng cấp.`,5000);
}
function emptyCard(){
  return `<div class="card" style="border:2px solid var(--brand)"><h2>Tool chưa có dữ liệu</h2><div class="muted">Nếu trước đây đã sao lưu lên Google Drive hoặc có file SAOLUU_….json, lấy lại ngay — đừng nạp lại từ đầu.${/^https?:$/.test(location.protocol)?'<br><b>Đang chuyển từ file TOOLS BC1+BC2+SBD.html trên máy sang web app?</b> Dữ liệu của file đó không tự sang đây: mở file cũ → Dữ liệu &amp; bảo mật → <b>Tải file sao lưu</b> (hoặc liên kết Google Drive), rồi quay lại đây bấm Khôi phục / Lấy dữ liệu từ Google Drive.':''}</div>
   <div class="row" style="margin-top:10px">${DRV.h?`<button class="btn pri" id="emDrv">${ic('download')}Lấy dữ liệu từ Google Drive</button>`:`<button class="btn pri" id="emLink">${ic('upload')}Liên kết thư mục Google Drive để lấy lại</button>`}<button class="btn" id="emFile">Khôi phục từ file sao lưu…</button></div></div>`;
}
function bindEmpty(){ const a=$('#emDrv'), b=$('#emLink'), f=$('#emFile'); if(a) a.onclick=drvPickRestore; if(b) b.onclick=()=>drvLink(); if(f) f.onclick=()=>$('#restoreFile').click(); }
function boot(){
  audReset();
  const go=()=>{ render(); setTimeout(inAppPopup,600);
    syncStore().then(async()=>{ audReset(); preUpgrade(); await drvLoad(); render(); whenIdle(()=>{ if(!USER) askUser(); }); }); };
  if(DB.sec&&DB.sec.hash) showLock(go); else go();
}

/* ================== KHỞI ĐỘNG ================== */
function newCourse(){
  const c0=C(); const c=defCourse();
  for(const k of ['dv1','dv2','giamDoc','noiKy','vanBan','thoiGian','sortMode','inPhuTrach']) c[k]=c0[k];
  const n=(+c0.soKhoa||0)+1; c.soKhoa=String(n); c.ten=c0.ten.replace(/\d+$/,'')+n; c.maKhoa=''; c.maBC2=''; c.khaiGiang=''; c.beGiang=''; c.ngayKy=''; c.ngaySH='';
  c.sbd={...c0.sbd,locked:false};
  DB.courses[c.id]=c; DB.cur=c.id; TAB='cfg'; save(); render(); toast('Đã tạo khóa '+c.ten+' — nhập thông tin khóa.');
}
init();
// đóng tab / tải lại trang ngay sau khi sửa: lưu liền, không đợi 0,25 giây
window.addEventListener('pagehide',()=>{ if(saveT){ clearTimeout(saveT); saveT=null; writeNow(); } });
$('#btnUndo').onclick=()=>askUndo();
$('#tabs').onclick=e=>{ const b=e.target.closest('button'); if(b){ if(b.dataset.t!==TAB) SEL.clear(); TAB=b.dataset.t; render(); window.scrollTo(0,0);} };
$('#verLink').textContent='v'+APP_VER; $('#verLink').onclick=e=>{ e.preventDefault(); showVersions(); };
$('#mauIn').onchange=e=>mauAttach(e.target.files[0]);
$('#formIn').onchange=e=>formUpload(e.target.files[0]);
$('#gq').onkeydown=e=>{ if(e.key==='Enter'){ const q=e.target.value.trim(); if(q) showFind(q); } };
$('#courseSel').onchange=e=>{ DB.cur=e.target.value; pending=[]; SEL.clear(); save(); render(); };
$('#btnNewCourse').onclick=newCourse;
$('#fileIn').onchange=e=>{ handleFiles(e.target.files); e.target.value=''; };
$('#btnBackup').onclick=manualBackup;
$('#btnRestore').onclick=()=>$('#restoreFile').click();
$('#restoreFile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; const t=await f.text(); e.target.value=''; restoreFlow(t,'file '+f.name); };
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{ e.preventDefault(); if(e.dataTransfer.files.length&&!e.target.closest('#drop')) handleFiles(e.dataTransfer.files); });
boot();
/* Web app (GitHub Pages): cài được như ứng dụng, mở được khi mất mạng */
if(/^https?:$/.test(location.protocol)&&'serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(e=>logErr('Service worker: '+e.message,'sw')); }); }
</script>
